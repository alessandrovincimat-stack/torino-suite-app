<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostica backend</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#111; color:#eee; padding:16px; }
  h1 { font-size:18px; }
  .test { background:#1c1a14; border:1px solid #333; border-radius:8px; padding:12px; margin-bottom:12px; }
  .ok { color:#7cd992; }
  .err { color:#ff8a80; }
  pre { white-space:pre-wrap; word-break:break-word; font-size:13px; }
  input { width:100%; box-sizing:border-box; padding:8px; margin-bottom:8px; background:#000; color:#eee; border:1px solid #444; border-radius:6px; }
  button { padding:10px 16px; background:#c9a227; color:#000; border:none; border-radius:6px; font-weight:bold; }
</style>
</head>
<body>
<h1>Diagnostica connessione backend</h1>
<input id="url" value="https://matcostruzioni.myqnapcloud.com:8443">
<input id="secret" placeholder="Chiave segreta (APP_SECRET) — opzionale, solo per il test 3">
<button onclick="runTests()">Esegui i test</button>
<div id="out"></div>

<script>
async function testOne(nome, fn){
  var div = document.createElement('div');
  div.className = 'test';
  div.innerHTML = '<strong>' + nome + '</strong><br><span>in corso…</span>';
  document.getElementById('out').appendChild(div);
  try {
    var risultato = await fn();
    div.innerHTML = '<strong>' + nome + '</strong><br><span class="ok">OK</span><pre>' + risultato + '</pre>';
  } catch(e) {
    div.innerHTML = '<strong>' + nome + '</strong><br><span class="err">FALLITO</span><pre>' + (e && e.message ? e.message : String(e)) + '</pre>';
  }
}

async function runTests(){
  document.getElementById('out').innerHTML = '';
  var base = document.getElementById('url').value.trim();
  var secret = document.getElementById('secret').value.trim();

  await testOne('1. GET semplice a /api/settings (senza header custom)', async function(){
    var r = await fetch(base + '/api/settings');
    var t = await r.text();
    return 'status: ' + r.status + '\n' + t;
  });

  await testOne('2. GET con header x-app-secret VUOTO (replica esattamente cosa fa l\'app quando la chiave non è impostata bene, forza il preflight CORS)', async function(){
    var r = await fetch(base + '/api/settings', { headers: { 'x-app-secret': '' } });
    var t = await r.text();
    return 'status: ' + r.status + '\n' + t;
  });

  if (secret) {
    await testOne('3. GET con header x-app-secret VALORIZZATO (replica esatta della app)', async function(){
      var r = await fetch(base + '/api/settings', { headers: { 'x-app-secret': secret } });
      var t = await r.text();
      return 'status: ' + r.status + '\n' + t;
    });
  }

  await testOne('4. OPTIONS manuale (verifica diretta della risposta al preflight)', async function(){
    var r = await fetch(base + '/api/settings', { method: 'OPTIONS' });
    var headers = [];
    r.headers.forEach(function(v,k){ headers.push(k + ': ' + v); });
    return 'status: ' + r.status + '\nheaders risposta:\n' + headers.join('\n');
  });
}
</script>
</body>
</html>
