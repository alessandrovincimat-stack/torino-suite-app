<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Quaderno — appunti a penna con IA</title>
<meta name="description" content="Quaderno digitale per la scuola: scrittura a penna, evidenziatore, forme, PDF da annotare e generazione di pagine con l'intelligenza artificiale." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Quaderno" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f5f4f2" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234c5fd7'/%3E%3Cpath d='M9 8.5h6.5a2.5 2.5 0 012.5 2.5v13a2 2 0 00-2-2H9z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M23 8.5h-4.2a2.5 2.5 0 00-2.3 2.5v13a2 2 0 012-2H23z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
/* ============================================================
   Quaderno — foglio di stile
   Tutto in un solo file, nessuna dipendenza esterna.
   ============================================================ */
:root{
  --bg:#f2f1ee;
  --bg-2:#ffffff;
  --bg-3:#e9e7e2;
  --fg:#14130f;
  --fg-2:#5d594f;
  --fg-3:#8c8579;
  --line:#dedad2;
  --line-2:#c9c4b9;
  --accent:#4c5fd7;
  --accent-soft:#e7e9fb;
  --accent-fg:#ffffff;
  --danger:#c0392b;
  --ok:#1f8a53;
  --warn:#b8860b;
  --shadow:0 1px 2px rgba(20,19,15,.06), 0 8px 24px rgba(20,19,15,.08);
  --shadow-lg:0 2px 6px rgba(20,19,15,.10), 0 24px 60px rgba(20,19,15,.18);
  --r:14px;
  --r-sm:10px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  color-scheme:light;
}
html[data-tema="scuro"]{
  --bg:#17171a;
  --bg-2:#212126;
  --bg-3:#2c2c33;
  --fg:#f2f1ee;
  --fg-2:#b3b0a8;
  --fg-3:#807d76;
  --line:#33333b;
  --line-2:#45454f;
  --accent:#8a97ff;
  --accent-soft:#2a2c47;
  --accent-fg:#14131a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;color:var(--fg);background:var(--bg);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px 11px;width:100%;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
label{display:block;font-size:12.5px;font-weight:600;color:var(--fg-2);margin:0 0 5px}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- bottoni ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:999px;background:var(--bg-2);
  border:1px solid var(--line);font-weight:600;font-size:14px;
  transition:background .12s, transform .06s, border-color .12s;
  white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--bg-3)}
.btn.primario{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primario:hover{filter:brightness(1.07)}
.btn.pericolo{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%, transparent)}
.btn.piatto{border-color:transparent;background:transparent}
.btn.piatto:hover{background:var(--bg-3)}
.btn.piccolo{padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icona{
  width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;
  justify-content:center;flex:0 0 auto;transition:background .12s,transform .06s;
}
.icona:hover{background:var(--bg-3)}
.icona:active{transform:scale(.92)}
.icona.attivo{background:var(--accent);color:var(--accent-fg)}
svg.i{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.pieno{fill:currentColor;stroke:none}

/* ---------- impalcatura ---------- */
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.vista{flex:1;min-height:0;display:none;flex-direction:column}
.vista.attiva{display:flex}

/* ============================ HOME ============================ */
#vista-home{overflow:auto;-webkit-overflow-scrolling:touch}
.home-top{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + var(--safe-t)) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
}
.home-top-riga{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo .mark{
  width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-fg);
  display:grid;place-items:center;flex:0 0 auto;box-shadow:var(--shadow);
}
.cresci{flex:1}
.cerca-wrap{position:relative;margin-top:10px}
.cerca-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--fg-3)}
#cerca{padding-left:36px;border-radius:999px;background:var(--bg-2)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);
  font-size:13px;font-weight:600;white-space:nowrap;color:var(--fg-2);
}
.chip.attivo{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.home-corpo{padding:18px calc(16px + var(--safe-r)) calc(40px + var(--safe-b)) calc(16px + var(--safe-l));max-width:1240px;margin:0 auto;width:100%}
.sezione-tit{font-size:13px;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 12px}
.sezione-tit:first-child{margin-top:4px}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:16px}
.quaderno{text-align:left;display:flex;flex-direction:column;gap:9px}
.copertina{
  position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--bg-2);
  box-shadow:var(--shadow);border:1px solid var(--line);
  transition:transform .14s cubic-bezier(.2,.8,.3,1), box-shadow .14s;
}
.quaderno:active .copertina{transform:scale(.97)}
.quaderno:hover .copertina{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.copertina .dorso{position:absolute;left:0;top:0;bottom:0;width:11px;background:var(--cc,#4c5fd7);opacity:.95;z-index:2}
.copertina .dorso:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.22),transparent)}
.copertina canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.copertina .vuota{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg-3)}
.copertina .conteggio{
  position:absolute;right:7px;bottom:7px;background:rgba(0,0,0,.62);color:#fff;
  font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;backdrop-filter:blur(6px);
}
.quaderno .nome{font-weight:650;font-size:14px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.quaderno .meta{font-size:12px;color:var(--fg-3);display:flex;align-items:center;gap:5px}
.pallino{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.nuovo-quaderno .copertina{
  border-style:dashed;border-width:2px;border-color:var(--line-2);background:transparent;
  display:grid;place-items:center;color:var(--fg-3);box-shadow:none;
}
.nuovo-quaderno:hover .copertina{border-color:var(--accent);color:var(--accent)}
.vuoto-stato{text-align:center;padding:64px 20px;color:var(--fg-3)}
.vuoto-stato h3{color:var(--fg);margin:14px 0 6px;font-size:18px}
.vuoto-stato p{margin:0 auto 20px;max-width:380px;font-size:14px;line-height:1.55}

/* ============================ EDITOR ============================ */
#vista-editor{background:var(--bg-3);position:relative}
.barra{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;
  padding:calc(6px + var(--safe-t)) calc(8px + var(--safe-r)) 6px calc(8px + var(--safe-l));
  background:color-mix(in srgb,var(--bg) 92%, transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);z-index:30;
}
.titolo-doc{
  font-weight:700;font-size:15px;border:0;background:transparent;padding:6px 8px;border-radius:8px;
  min-width:60px;max-width:min(38vw,320px);text-overflow:ellipsis;
}
.titolo-doc:focus{background:var(--bg-2);box-shadow:none;border:1px solid var(--line)}
.pag-ind{
  font-size:12.5px;font-weight:700;color:var(--fg-2);background:var(--bg-2);border:1px solid var(--line);
  padding:5px 10px;border-radius:999px;white-space:nowrap;
}
.area{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--bg-3);touch-action:none}
#tela{position:absolute;left:0;top:0;display:block}
#sovra{position:absolute;left:0;top:0;pointer-events:none}
.area.penna-attiva{cursor:crosshair}

/* dock strumenti */
.dock{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(14px + var(--safe-b));z-index:40;
  display:flex;align-items:center;gap:3px;padding:5px;
  background:color-mix(in srgb,var(--bg-2) 95%, transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow-lg);
  max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;
}
.dock::-webkit-scrollbar{display:none}
.dock .sep{width:1px;height:24px;background:var(--line);margin:0 3px;flex:0 0 auto}
.strumento{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;position:relative;transition:background .12s,transform .1s}
.strumento:hover{background:var(--bg-3)}
.strumento.attivo{background:var(--accent);color:var(--accent-fg);transform:translateY(-3px)}
.strumento.attivo:after{
  content:"";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--accent);
}
.punta-colore{
  position:absolute;right:4px;bottom:4px;width:9px;height:9px;border-radius:50%;
  border:1.5px solid var(--bg-2);box-shadow:0 0 0 .5px rgba(0,0,0,.2);
}

/* pannello opzioni strumento */
.opzioni{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(70px + var(--safe-b));z-index:41;width:min(330px,calc(100vw - 24px));
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-lg);padding:14px;
  animation:sali .16s cubic-bezier(.2,.8,.3,1);
}
@keyframes sali{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.opzioni h4{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3)}
.colori{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.colore{
  aspect-ratio:1;border-radius:50%;border:2px solid transparent;position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .1s;
}
.colore:active{transform:scale(.88)}
.colore.attivo{border-color:var(--fg);transform:scale(1.1)}
.spessori{display:flex;align-items:center;gap:10px;margin-top:12px}
.spessori input[type=range]{flex:1;padding:0;border:0;background:transparent;accent-color:var(--accent)}
.anteprima-tratto{width:54px;height:30px;flex:0 0 auto;background:var(--bg-3);border-radius:8px}
.riga-opz{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:13.5px;font-weight:600}
.presets{display:flex;gap:7px;margin-top:10px}
.preset{flex:1;padding:7px 0;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:650;background:var(--bg)}
.preset.attivo{background:var(--accent);color:var(--accent-fg);border-color:transparent}

/* interruttore */
.sw{width:44px;height:26px;border-radius:999px;background:var(--line-2);position:relative;flex:0 0 auto;transition:background .16s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .16s}
.sw.on{background:var(--accent)}
.sw.on:after{transform:translateX(18px)}

/* miniature pagine */
.pagine-drawer{
  position:absolute;left:0;top:0;bottom:0;width:172px;z-index:45;
  background:color-mix(in srgb,var(--bg-2) 96%, transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-right:1px solid var(--line);overflow-y:auto;padding:12px 12px calc(20px + var(--safe-b));
  transform:translateX(-100%);transition:transform .2s cubic-bezier(.2,.8,.3,1);
}
.pagine-drawer.aperto{transform:translateX(0)}
.mini{
  position:relative;width:100%;aspect-ratio:1/1.414;border-radius:8px;overflow:hidden;
  background:#fff;border:2px solid var(--line);margin-bottom:10px;box-shadow:var(--shadow);
  transition:border-color .12s;
}
.mini.attiva{border-color:var(--accent)}
.mini canvas{width:100%;height:100%;display:block}
.mini .num{position:absolute;left:5px;bottom:4px;font-size:10px;font-weight:800;color:#5d594f;background:rgba(255,255,255,.85);padding:1px 5px;border-radius:5px}
.mini-azioni{display:flex;gap:6px;margin:-4px 0 12px}
.mini-azioni button{flex:1;font-size:11px;padding:4px 0;border-radius:7px;background:var(--bg-3);font-weight:650;color:var(--fg-2)}

/* selezione lazo */
.sel-menu{
  position:absolute;z-index:44;display:flex;gap:2px;padding:4px;
  background:var(--bg-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);
}
.sel-menu button{width:36px;height:36px;border-radius:9px;display:grid;place-items:center}
.sel-menu button:hover{background:var(--bg-3)}

/* casella di testo in modifica */
#editor-testo{
  position:absolute;z-index:43;background:rgba(255,255,255,.04);border:1.5px dashed var(--accent);
  border-radius:4px;padding:0;margin:0;resize:none;overflow:hidden;box-shadow:none;
  transform-origin:0 0;line-height:1.35;
}
#editor-testo:focus{box-shadow:none;border-color:var(--accent)}

/* ============================ MODALI ============================ */
.velo{
  position:fixed;inset:0;z-index:100;background:rgba(10,10,12,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;
  animation:sfuma .14s ease;
}
@media(min-width:680px){.velo{align-items:center}}
@keyframes sfuma{from{opacity:0}to{opacity:1}}
.foglio{
  background:var(--bg);width:100%;max-width:560px;max-height:min(88vh,880px);
  border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;overflow:hidden;
  animation:entra .22s cubic-bezier(.2,.8,.3,1);
  padding-bottom:var(--safe-b);
}
@media(min-width:680px){.foglio{border-radius:18px;padding-bottom:0}}
@keyframes entra{from{transform:translateY(22px);opacity:.4}to{transform:translateY(0);opacity:1}}
.foglio.largo{max-width:760px}
.foglio-top{
  display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
  flex:0 0 auto;background:var(--bg-2);
}
.foglio-top h2{margin:0;font-size:16.5px;font-weight:750;letter-spacing:-.01em}
.foglio-corpo{padding:16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.foglio-fondo{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex:0 0 auto;background:var(--bg-2)}
.campo{margin-bottom:14px}
.aiuto{font-size:12px;color:var(--fg-3);margin-top:5px;line-height:1.45}
.griglia-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scelte{display:flex;flex-wrap:wrap;gap:7px}
.scelta{
  padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);
  font-size:13.5px;font-weight:600;color:var(--fg-2);text-align:left;
}
.scelta.attivo{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.scelta small{display:block;font-weight:500;opacity:.8;font-size:11.5px}
.lista-voci{display:flex;flex-direction:column;gap:2px}
.voce{
  display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:12px;
  background:var(--bg-2);border:1px solid var(--line);text-align:left;width:100%;
}
.voce:hover{background:var(--bg-3)}
.voce .tit{font-weight:650;font-size:14.5px}
.voce .sub{font-size:12.5px;color:var(--fg-3);margin-top:1px}
.avviso{
  background:color-mix(in srgb,var(--warn) 12%, var(--bg-2));
  border:1px solid color-mix(in srgb,var(--warn) 35%, transparent);
  border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;color:var(--fg-2);
}
.avviso b{color:var(--fg)}
pre.codice{
  background:var(--bg-3);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
  overflow-x:auto;margin:8px 0 0;line-height:1.5;white-space:pre;
}

/* modelli di carta */
.griglia-modelli{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:11px}
.modello{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:11.5px;font-weight:600;color:var(--fg-2)}
.modello .prev{width:100%;aspect-ratio:1/1.414;border-radius:8px;border:2px solid var(--line);overflow:hidden;background:#fff}
.modello.attivo .prev{border-color:var(--accent)}
.modello.attivo{color:var(--accent)}
.modello canvas{width:100%;height:100%;display:block}

/* IA */
.ia-stato{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--fg-2);padding:14px 2px}
.girella{
  width:17px;height:17px;border-radius:50%;flex:0 0 auto;
  border:2.5px solid var(--line-2);border-top-color:var(--accent);animation:gira .7s linear infinite;
}
@keyframes gira{to{transform:rotate(360deg)}}
.ia-suggerimenti{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.sugg{
  padding:6px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);
  font-size:12.5px;font-weight:600;border:1px solid transparent;
}
html[data-tema="scuro"] .sugg{color:var(--fg)}

/* avvisi a comparsa */
#toast-box{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--fg);color:var(--bg);padding:10px 17px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);max-width:88vw;text-align:center;
  animation:toast-in .2s cubic-bezier(.2,.8,.3,1);
}
.toast.err{background:var(--danger);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
@keyframes toast-in{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}

/* barra di caricamento globale */

<script>
"use strict";
/* ============================================================
   1. Utilità di base
   ============================================================ */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

function uid(p){ return (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}
function debounce(fn, ms){
  let t; return function(){ const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); };
}
function toast(msg, tipo){
  const box = $('#toast-box');
  const d = document.createElement('div');
  d.className = 'toast' + (tipo ? ' ' + tipo : '');
  d.textContent = msg;
  box.appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity .3s'; }, tipo === 'err' ? 4200 : 2200);
  setTimeout(() => d.remove(), tipo === 'err' ? 4600 : 2600);
}
let _prog = 0, _progT = null;
function progresso(p){
  const b = $('#caricamento');
  if (p === null){ // chiudi
    b.style.width = '100%'; b.style.opacity = '0';
    clearTimeout(_progT); _progT = setTimeout(() => { b.style.width = '0'; b.style.opacity = '1'; }, 320);
    return;
  }
  _prog = p; b.style.opacity = '1'; b.style.width = Math.round(p * 100) + '%';
}
/* contesto di servizio usato solo per misurare il testo */
const ctxMisura = document.createElement('canvas').getContext('2d');

function dataBreve(ts){
  if (!ts) return '';
  const d = new Date(ts), ora = new Date();
  const giorni = Math.floor((ora.setHours(0,0,0,0) - new Date(ts).setHours(0,0,0,0)) / 86400000);
  if (giorni === 0) return 'oggi';
  if (giorni === 1) return 'ieri';
  if (giorni < 7) return giorni + ' giorni fa';
  return d.toLocaleDateString('it-IT', { day:'numeric', month:'short', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
}

/* ============================================================
   2. Archivio locale (IndexedDB)
   ============================================================ */
const DB_NOME = 'quaderno', DB_VER = 1;
let _db = null;

function apriDB(){
  if (_db) return Promise.resolve(_db);
  return new Promise((ris, rif) => {
    const req = indexedDB.open(DB_NOME, DB_VER);
    req.onupgradeneeded = ev => {
      const d = ev.target.result;
      if (!d.objectStoreNames.contains('quaderni')) d.createObjectStore('quaderni', { keyPath:'id' });
      if (!d.objectStoreNames.contains('pagine')){
        const s = d.createObjectStore('pagine', { keyPath:'id' });
        s.createIndex('perQuaderno', 'quadernoId', { unique:false });
      }
      if (!d.objectStoreNames.contains('asset')) d.createObjectStore('asset', { keyPath:'id' });
      if (!d.objectStoreNames.contains('config')) d.createObjectStore('config', { keyPath:'k' });
    };
    req.onsuccess = () => { _db = req.result; ris(_db); };
    req.onerror = () => rif(req.error);
  });
}
const archivio = {
  async _op(store, modo, fn){
    const d = await apriDB();
    return new Promise((ris, rif) => {
      const t = d.transaction(store, modo);
      const r = fn(t.objectStore(store));
      t.oncomplete = () => ris(r && r.result !== undefined ? r.result : undefined);
      t.onerror = () => rif(t.error);
    });
  },
  salva(store, val){ return this._op(store, 'readwrite', s => s.put(val)); },
  leggi(store, k){ return this._op(store, 'readonly', s => s.get(k)); },
  elimina(store, k){ return this._op(store, 'readwrite', s => s.delete(k)); },
  tutti(store){ return this._op(store, 'readonly', s => s.getAll()); },
  async perIndice(store, indice, k){
    const d = await apriDB();
    return new Promise((ris, rif) => {
      const t = d.transaction(store, 'readonly');
      const r = t.objectStore(store).index(indice).getAll(k);
      t.oncomplete = () => ris(r.result || []);
      t.onerror = () => rif(t.error);
    });
  }
};

/* ============================================================
   4. Modelli di carta (disegno procedurale)
   ============================================================ */
function disegnaCarta(ctx, pag){
  const carta = CARTE[pag.carta] || CARTE.bianco;
  const s = 1, W = pag.w, H = pag.h;
  ctx.fillStyle = carta.sfondo;
  ctx.fillRect(0, 0, W, H);
  const modello = pag.modello || 'bianco';
  if (modello === 'bianco') return;

  ctx.save();
  ctx.strokeStyle = carta.riga;
  ctx.lineWidth = Math.max(0.5, 1 * s);
  ctx.globalAlpha = 0.85;
  const P = 60 * s;                      // margine interno

  const righe = (passo, daY) => {
    ctx.beginPath();
    for (let y = (daY || P); y < H - P * 0.5; y += passo){
      ctx.moveTo(P, Math.round(y) + 0.5); ctx.lineTo(W - P, Math.round(y) + 0.5);
    }
    ctx.stroke();
  };
  const griglia = passo => {
    ctx.beginPath();
    for (let y = passo; y < H; y += passo){ ctx.moveTo(0, Math.round(y) + .5); ctx.lineTo(W, Math.round(y) + .5); }
    for (let x = passo; x < W; x += passo){ ctx.moveTo(Math.round(x) + .5, 0); ctx.lineTo(Math.round(x) + .5, H); }
    ctx.stroke();
  };

  if (modello === 'righe')            righe(44 * s);
  else if (modello === 'righe-strette') righe(32 * s);
  else if (modello === 'quadretti')     { ctx.globalAlpha = .6; griglia(23.8 * s); }
  else if (modello === 'quadretti-grandi'){ ctx.globalAlpha = .6; griglia(47.6 * s); }
  else if (modello === 'puntini'){
    ctx.fillStyle = carta.riga; ctx.globalAlpha = .75;
    const passo = 40 * s, r = Math.max(0.8, 1.5 * s);
    for (let y = passo; y < H; y += passo)
      for (let x = passo; x < W; x += passo){ ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
  }
  else if (modello === 'margine'){
    righe(44 * s);
    ctx.globalAlpha = .9; ctx.strokeStyle = '#e0a0a0';
    ctx.beginPath(); ctx.moveTo(150 * s, P * .4); ctx.lineTo(150 * s, H - P * .4); ctx.stroke();
  }
  else if (modello === 'cornell'){
    righe(44 * s, 200 * s);
    ctx.globalAlpha = .95; ctx.strokeStyle = carta.riga; ctx.lineWidth = Math.max(1, 1.6 * s);
    ctx.beginPath();
    ctx.moveTo(P, 160 * s); ctx.lineTo(W - P, 160 * s);              // intestazione
    ctx.moveTo(320 * s, 160 * s); ctx.lineTo(320 * s, H - 260 * s);   // colonna domande
    ctx.moveTo(P, H - 260 * s); ctx.lineTo(W - P, H - 260 * s);       // riepilogo
    ctx.stroke();
  }
  else if (modello === 'musica'){
    ctx.lineWidth = Math.max(0.6, 1 * s);
    const passo = 12 * s, gruppo = 130 * s;
    for (let g = 0; g < 9; g++){
      const y0 = (120 + g * 130) * s;
      if (y0 + passo * 4 > H - 60 * s) break;
      ctx.beginPath();
      for (let k = 0; k < 5; k++){ const y = y0 + k * passo; ctx.moveTo(P, y); ctx.lineTo(W - P, y); }
      ctx.stroke();
    }
  }
  ctx.restore();
}

function nuovaPagina(quadernoId, opz){

    id: uid('p_'),
    quadernoId,
    ordine: opz.ordine != null ? opz.ordine : 0,
    w: opz.w || PAG_W,
    h: opz.h || PAG_H,
    modello: opz.modello || 'righe',
    carta: opz.carta || 'bianco',
    tratti: [],
    oggetti: [],
    blocchi: null,
    titoloBlocchi: '',
    mostraRisposte: true,
    sfondo: null,
    creato: Date.now(),
    modificato: Date.now()
  };
}
async function creaQuaderno(dati){
  const q = {
    id: uid('q_'),
    nome: dati.nome || 'Nuovo quaderno',
    materia: dati.materia || 'Generale',
    colore: dati.colore || COL_MATERIA[0],
    modello: dati.modello || 'righe',
    carta: dati.carta || 'bianco',
    creato: Date.now(),
    modificato: Date.now()
  };
  await archivio.salva('quaderni', q);
  const p = nuovaPagina(q.id, { ordine:0, modello:q.modello, carta:q.carta });
  await archivio.salva('pagine', p);
  stato.quaderni.unshift(q);
  return q;
}
async function eliminaQuaderno(id){
  const pagine = await archivio.perIndice('pagine', 'perQuaderno', id);
  for (const p of pagine){
    if (p.sfondo) await archivio.elimina('asset', p.sfondo).catch(() => {});
    for (const o of (p.oggetti || [])) if (o.asset) await archivio.elimina('asset', o.asset).catch(() => {});
    await archivio.elimina('pagine', p.id);
  }
  await archivio.elimina('quaderni', id);
  stato.quaderni = stato.quaderni.filter(q => q.id !== id);
}

  let html = '';

/* miniatura di una pagina su un canvas (larghezza in px css) */
async function renderMiniatura(P, canvas, larghezza){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = larghezza / P.w;
  canvas.width = Math.round(P.w * s * dpr);
  canvas.height = Math.round(P.h * s * dpr);
  canvas.style.width = '100%'; canvas.style.height = '100%';
  const ctx = canvas.getContext('2d');
  ctx.scale(s * dpr, s * dpr);          // da qui in poi si lavora in unità pagina
  await precaricaAsset(P);
  disegnaContenuto(ctx, P, false);
}

const cacheAsset = new Map();
async function salvaAsset(blob){
  const id = uid('a_');

  return id;
}
async function caricaAsset(id){
  if (!id) return null;
  if (cacheAsset.has(id)) return cacheAsset.get(id);
  const rec = await archivio.leggi('asset', id);
  if (!rec) return null;
  let img;
  try {
    img = await createImageBitmap(rec.blob);
  } catch(e){
    img = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = URL.createObjectURL(rec.blob); });
  }
  cacheAsset.set(id, img);
  return img;
}

/* ============================================================
   9. Motore di disegno
   ============================================================ */
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
const area   = $('#area');
const tela   = $('#tela');
const sovra  = $('#sovra');
const ctxT   = tela.getContext('2d');
const ctxS   = sovra.getContext('2d');

let layer = null, layerCtx = null, layerScala = 1;   // cache dei tratti già chiusi
let trattoVivo = null;                                // tratto in corso
let rafAttivo = false, rafSovra = false;

function pag(){ return stato.pagine[stato.iPagina] || null; }

let _rett = null;
function rettArea(){ return _rett || (_rett = area.getBoundingClientRect()); }
window.addEventListener('scroll', () => { _rett = null; }, true);

function dimensionaTele(){
  _rett = null;
  const r = rettArea();
  [tela, sovra].forEach(c => {
    c.width = Math.round(r.width * DPR);
    c.height = Math.round(r.height * DPR);
    c.style.width = r.width + 'px';
    c.style.height = r.height + 'px';
  });
  richiediRender(); richiediSovra();
}

function richiediRender(){
  if (rafAttivo) return;
  rafAttivo = true;
  requestAnimationFrame(() => { rafAttivo = false; render(); });
}
function richiediSovra(){
  if (rafSovra) return;
  rafSovra = true;
  requestAnimationFrame(() => { rafSovra = false; renderSovra(); });
}

/* --- trasformazioni schermo <-> pagina --- */
function versoPagina(cx, cy){
  const r = rettArea(), v = stato.vista;
  return { x: (cx - r.left - v.x) / v.zoom, y: (cy - r.top - v.y) / v.zoom };
}
function versoSchermo(x, y){
  const v = stato.vista;
  return { x: x * v.zoom + v.x, y: y * v.zoom + v.y };
}

/* --- disegno di un singolo tratto (contesto in unità pagina) --- */
function disegnaTratto(ctx, t){
  const p = t.pts;
  if (!p || p.length < 3) return;
  const evid = t.t === 'evid';
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = t.c;
  if (evid){
    ctx.globalAlpha = 0.34;
    ctx.globalCompositeOperation = 'multiply';
    ctx.lineCap = 'butt';
  }
  const n = p.length / 3;
  if (n === 1){                                   // punto isolato
    ctx.globalCompositeOperation = evid ? 'multiply' : 'source-over';
    ctx.fillStyle = t.c;
    ctx.beginPath(); ctx.arc(p[0], p[1], Math.max(0.4, t.w * (evid ? 0.5 : p[2] * 0.6)), 0, 6.2832); ctx.fill();
    ctx.restore(); return;
  }
  if (evid){                                      // spessore costante
    ctx.lineWidth = t.w;
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    for (let i = 1; i < n; i++){
      const x = p[i*3], y = p[i*3+1];
      const px = p[(i-1)*3], py = p[(i-1)*3+1];
      ctx.quadraticCurveTo(px, py, (px + x) / 2, (py + y) / 2);
    }
    ctx.lineTo(p[(n-1)*3], p[(n-1)*3+1]);
    ctx.stroke(); ctx.restore(); return;
  }
  // penna: spessore variabile, segmenti raggruppati per larghezza simile
  let gruppoW = -1;
  const apri = w => { ctx.beginPath(); ctx.lineWidth = w; gruppoW = w; };
  const chiudi = () => { if (gruppoW > 0) ctx.stroke(); };
  for (let i = 1; i < n; i++){
    const x0 = p[(i-1)*3], y0 = p[(i-1)*3+1], pr0 = p[(i-1)*3+2];
    const x1 = p[i*3],     y1 = p[i*3+1],     pr1 = p[i*3+2];
    const w = Math.max(0.25, t.w * (0.32 + 0.68 * ((pr0 + pr1) / 2)));
    const wq = Math.round(w * 6) / 6;             // raggruppo per ridurre le chiamate
    if (wq !== gruppoW){ chiudi(); apri(wq); ctx.moveTo((x0 + (i > 1 ? p[(i-2)*3] : x0)) / 2, (y0 + (i > 1 ? p[(i-2)*3+1] : y0)) / 2); }
    ctx.quadraticCurveTo(x0, y0, (x0 + x1) / 2, (y0 + y1) / 2);
    if (i === n - 1) ctx.lineTo(x1, y1);
  }
  chiudi();
  ctx.restore();
}

/* --- layer dei tratti --- */
function scalaLayerIdeale(){ return clamp(stato.vista.zoom * DPR, 1, 2); }

function rigeneraLayer(){
  const P = pag(); if (!P) return;
  const s = scalaLayerIdeale();
  if (!layer){ layer = document.createElement('canvas'); layerCtx = layer.getContext('2d'); }
  const w = Math.round(P.w * s), h = Math.round(P.h * s);
  if (layer.width !== w || layer.height !== h){ layer.width = w; layer.height = h; }
  else layerCtx.clearRect(0, 0, w, h);
  layerScala = s;
  layerCtx.setTransform(s, 0, 0, s, 0, 0);
  for (const t of P.tratti) if (!t._nascosto) disegnaTratto(layerCtx, t);
}
function aggiungiALayer(t){
  if (!layer) return rigeneraLayer();
  layerCtx.setTransform(layerScala, 0, 0, layerScala, 0, 0);
  disegnaTratto(layerCtx, t);
}

/* --- disegno completo della pagina (contesto in unità pagina) --- */
function disegnaContenuto(ctx, P, conLayer){
  disegnaCarta(ctx, P);
  const sf = P.sfondo && cacheAsset.get(P.sfondo);
  if (sf) ctx.drawImage(sf, 0, 0, P.w, P.h);
  if (P.blocchi && P.blocchi.length) disegnaBlocchi(ctx, P);
  for (const o of (P.oggetti || [])) disegnaOggetto(ctx, o);
  if (conLayer && layer) ctx.drawImage(layer, 0, 0, P.w, P.h);
  else for (const t of (P.tratti || [])) if (!t._nascosto) disegnaTratto(ctx, t);
}

function render(){
  const P = pag(); if (!P) return;
  const v = stato.vista;
  ctxT.setTransform(1, 0, 0, 1, 0, 0);
  ctxT.clearRect(0, 0, tela.width, tela.height);
  ctxT.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctxT.translate(v.x, v.y);
  ctxT.scale(v.zoom, v.zoom);
  // ombra del foglio
  ctxT.save();
  ctxT.shadowColor = 'rgba(0,0,0,.25)';
  ctxT.shadowBlur = 26 / v.zoom;
  ctxT.shadowOffsetY = 7 / v.zoom;
  ctxT.fillStyle = (CARTE[P.carta] || CARTE.bianco).sfondo;
  ctxT.fillRect(0, 0, P.w, P.h);
  ctxT.restore();
  ctxT.save();
  ctxT.beginPath(); ctxT.rect(0, 0, P.w, P.h); ctxT.clip();
  disegnaContenuto(ctxT, P, true);
  if (trattoVivo) disegnaTratto(ctxT, trattoVivo);
  ctxT.restore();
}

function renderSovra(){
  const v = stato.vista;
  ctxS.setTransform(1, 0, 0, 1, 0, 0);
  ctxS.clearRect(0, 0, sovra.width, sovra.height);
  ctxS.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctxS.translate(v.x, v.y);
  ctxS.scale(v.zoom, v.zoom);
  const k = 1 / v.zoom;

  if (lazoPunti && lazoPunti.length > 3){
    ctxS.save();
    ctxS.strokeStyle = '#4c5fd7'; ctxS.lineWidth = 1.6 * k;
    ctxS.setLineDash([7 * k, 5 * k]);
    ctxS.beginPath(); ctxS.moveTo(lazoPunti[0], lazoPunti[1]);
    for (let i = 2; i < lazoPunti.length; i += 2) ctxS.lineTo(lazoPunti[i], lazoPunti[i+1]);
    ctxS.stroke();
    ctxS.restore();
  }
  const sel = stato.selezione;
  if (sel && sel.bbox){
    const b = sel.bbox;
    ctxS.save();
    ctxS.strokeStyle = '#4c5fd7'; ctxS.fillStyle = 'rgba(76,95,215,.09)';
    ctxS.lineWidth = 1.5 * k; ctxS.setLineDash([6 * k, 4 * k]);
    ctxS.fillRect(b.x, b.y, b.w, b.h);
    ctxS.strokeRect(b.x, b.y, b.w, b.h);
    ctxS.setLineDash([]);
    ctxS.fillStyle = '#4c5fd7';
    const r = 7 * k;
    ctxS.beginPath(); ctxS.arc(b.x + b.w, b.y + b.h, r, 0, 6.2832); ctxS.fill();
    ctxS.strokeStyle = '#fff'; ctxS.lineWidth = 2 * k; ctxS.stroke();
    ctxS.restore();
  }
  if (cursoreGomma){
    ctxS.save();
    ctxS.strokeStyle = 'rgba(0,0,0,.55)'; ctxS.fillStyle = 'rgba(255,255,255,.35)';
    ctxS.lineWidth = 1.2 * k;
    ctxS.beginPath(); ctxS.arc(cursoreGomma.x, cursoreGomma.y, stato.gomma.dim / 2, 0, 6.2832);
    ctxS.fill(); ctxS.stroke();
    ctxS.restore();
  }
  if (guidaForma){
    ctxS.save();
    ctxS.strokeStyle = '#4c5fd7'; ctxS.lineWidth = 1.2 * k; ctxS.setLineDash([5 * k, 4 * k]);
    ctxS.stroke(guidaForma);
    ctxS.restore();
  }
}

/* ============================================================
   10. Oggetti (testo e immagini)
   ============================================================ */
function disegnaOggetto(ctx, o){
  if (o._nascosto) return;
  if (o.tipo === 'immagine'){
    const img = cacheAsset.get(o.asset);
    if (img) ctx.drawImage(img, o.x, o.y, o.w, o.h);
    else { ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.05)'; ctx.fillRect(o.x, o.y, o.w, o.h); ctx.restore(); }
    return;
  }
  if (o.tipo === 'testo'){
    ctx.save();
    ctx.fillStyle = o.colore;
    ctx.textBaseline = 'top';
    const righe = spezzaTesto(ctx, o.testo || '', o.w, o.dim, o.grassetto);
    let y = o.y;
    for (const r of righe){ ctx.fillText(r, o.x, y); y += o.dim * 1.32; }
    ctx.restore();
  }
}
function fontPer(dim, grassetto, corsivo){
  return (corsivo ? 'italic ' : '') + (grassetto ? '650 ' : '400 ') + dim + 'px ' +
    '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
}
function spezzaTesto(ctx, testo, larghezza, dim, grassetto){
  ctx.font = fontPer(dim, grassetto);
  const out = [];
  for (const paragrafo of String(testo).split('\n')){
    if (!paragrafo){ out.push(''); continue; }
    let riga = '';
    for (const parola of paragrafo.split(' ')){
      const prova = riga ? riga + ' ' + parola : parola;
      if (ctx.measureText(prova).width > larghezza && riga){ out.push(riga); riga = parola; }
      else riga = prova;
    }
    out.push(riga);
  }
  return out;
}
function altezzaOggetto(o){
  if (o.tipo === 'immagine') return o.h;
  return spezzaTesto(ctxMisura, o.testo || '', o.w, o.dim, o.grassetto).length * o.dim * 1.32;
}
function bboxOggetto(o){
  return o.tipo === 'immagine'
    ? { x:o.x, y:o.y, w:o.w, h:o.h }
    : { x:o.x, y:o.y, w:o.w, h:altezzaOggetto(o) };
}

/* ============================================================
   11. Cronologia (annulla / ripeti)
   ============================================================ */
function azione(op){
  op.pg = op.pg || pag().id;
  stato.storia.push(op);
  if (stato.storia.length > MAX_STORIA) stato.storia.shift();
  stato.futuro.length = 0;
  aggiornaBottoniStoria();
}
function aggiornaBottoniStoria(){
  const s = !stato.storia.length, f = !stato.futuro.length;
  $('#b-annulla').disabled = s; $('#b-annulla2').disabled = s;
  $('#b-ripeti').disabled = f;  $('#b-ripeti2').disabled = f;
}
function applicaOp(op, inverti){
  const P = stato.pagine.find(p => p.id === op.pg);
  if (!P) return;
  if (stato.pagine.indexOf(P) !== stato.iPagina) vaiAPagina(stato.pagine.indexOf(P));
  const T = P.tratti, O = P.oggetti;
  switch (op.t){
    case 'at': { // tratti aggiunti
      if (inverti){ const ids = new Set(op.tratti.map(t => t.id)); P.tratti = T.filter(t => !ids.has(t.id)); }
      else P.tratti = T.concat(op.tratti);
      break;
    }
    case 'dt': { // tratti rimossi
      if (inverti){ op.voci.slice().sort((a,b) => a.i - b.i).forEach(v => T.splice(v.i, 0, v.t)); }
      else { const ids = new Set(op.voci.map(v => v.t.id)); P.tratti = T.filter(t => !ids.has(t.id)); }
      break;
    }
    case 'st': { // sostituzione (gomma parziale)
      if (inverti){
        const ids = new Set(op.nuovi.map(t => t.id));
        P.tratti = T.filter(t => !ids.has(t.id));
        op.voci.slice().sort((a,b) => a.i - b.i).forEach(v => P.tratti.splice(v.i, 0, v.t));
      } else {
        const ids = new Set(op.voci.map(v => v.t.id));
        P.tratti = T.filter(t => !ids.has(t.id)).concat(op.nuovi);
      }
      break;
    }
    case 'mt': { // tratti modificati (sposta/scala/colore)
      for (const v of op.voci){
        const t = P.tratti.find(x => x.id === v.id); if (!t) continue;
        const salva = { pts: t.pts, c: t.c, w: t.w };
        if (v.prima.pts) t.pts = v.prima.pts;
        if (v.prima.c != null) t.c = v.prima.c;
        if (v.prima.w != null) t.w = v.prima.w;
        v.prima = salva;
      }
      break;
    }
    case 'ao': {
      if (inverti){ const ids = new Set(op.oggetti.map(o => o.id)); P.oggetti = O.filter(o => !ids.has(o.id)); }
      else P.oggetti = O.concat(op.oggetti);
      break;
    }
    case 'do': {
      if (inverti) op.voci.slice().sort((a,b) => a.i - b.i).forEach(v => O.splice(v.i, 0, v.o));
      else { const ids = new Set(op.voci.map(v => v.o.id)); P.oggetti = O.filter(o => !ids.has(o.id)); }
      break;
    }
    case 'mo': {
      for (const v of op.voci){
        const o = P.oggetti.find(x => x.id === v.id); if (!o) continue;
        const salva = {};
        for (const k in v.prima){ salva[k] = o[k]; o[k] = v.prima[k]; }
        v.prima = salva;
      }
      break;
    }
    case 'bl': {
      const salva = { blocchi: P.blocchi, titoloBlocchi: P.titoloBlocchi };
      P.blocchi = op.prima.blocchi; P.titoloBlocchi = op.prima.titoloBlocchi;
      op.prima = salva;
      break;
    }
  }
  P.modificato = Date.now();
  deselezionaSilenzioso();
  rigeneraLayer(); richiediRender(); richiediSovra();
  pianificaSalvataggio(P);
  aggiornaMiniature();
}
function annulla(){
  const op = stato.storia.pop(); if (!op) return;
  applicaOp(op, true);
  stato.futuro.push(op);
  aggiornaBottoniStoria();
}
function ripeti(){
  const op = stato.futuro.pop(); if (!op) return;
  applicaOp(op, false);
  stato.storia.push(op);
  aggiornaBottoniStoria();
}

/* ============================================================
   12. Salvataggio
   ============================================================ */
const daSalvare = new Map();
let timerSalva = null;
function pianificaSalvataggio(P){
  P.modificato = Date.now();
  daSalvare.set(P.id, P);
  if (stato.quaderno) stato.quaderno.modificato = Date.now();
  clearTimeout(timerSalva);
  timerSalva = setTimeout(salvaSubito, 700);
}
async function salvaSubito(){
  clearTimeout(timerSalva);
  const elenco = Array.from(daSalvare.values());
  daSalvare.clear();
  for (const P of elenco){
    const copia = Object.assign({}, P);
    // i campi di servizio (riquadri calcolati, oggetto in modifica) non vanno salvati
    copia.tratti = P.tratti.map(t => ({ id:t.id, t:t.t, c:t.c, w:t.w, pts: Array.from(t.pts) }));
    copia.oggetti = (P.oggetti || []).map(o => { const c = Object.assign({}, o); delete c._nascosto; return c; });
    await archivio.salva('pagine', copia);
  }
  if (stato.quaderno) await archivio.salva('quaderni', stato.quaderno);
}
window.addEventListener('pagehide', () => { if (daSalvare.size) salvaSubito(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && daSalvare.size) salvaSubito(); });

async function precaricaAsset(P){
  const ids = [];
  if (P.sfondo) ids.push(P.sfondo);
  for (const o of (P.oggetti || [])) if (o.asset) ids.push(o.asset);
  await Promise.all(ids.map(caricaAsset));
}

async function apriQuaderno(id, iPagina){

/* ============================================================
   14. Navigazione fra pagine, zoom
   ============================================================ */
function aggiornaIndicatorePagina(){
  const el = $('#pag-ind');
  el.innerHTML =
    '<button data-p="-1" style="padding:0 5px;font-weight:800;opacity:.75">‹</button>' +
    '<span style="padding:0 5px">' + (stato.iPagina + 1) + ' / ' + stato.pagine.length + '</span>' +
    '<button data-p="1" style="padding:0 5px;font-weight:800;opacity:.75">›</button>';
  el.style.display = 'inline-flex';
  el.style.alignItems = 'center';
  $$('[data-p]', el).forEach(b => b.onclick = () => vaiAPagina(stato.iPagina + Number(b.dataset.p)));
}
async function vaiAPagina(i){
  i = clamp(i, 0, stato.pagine.length - 1);
  if (i === stato.iPagina && layer) return;
  chiudiEditorTesto();
  deselezionaSilenzioso();
  stato.iPagina = i;
  await precaricaAsset(pag());
  rigeneraLayer();
  richiediRender(); richiediSovra();
  aggiornaIndicatorePagina();
  aggiornaMiniature();
}
function adattaZoom(){
  const P = pag(); if (!P) return;
  const r = rettArea();
  const padX = 24, padSopra = 20, padSotto = 78;   // sotto ci sta la barra degli strumenti
  const zLargh = (r.width - padX * 2) / P.w;
  // su schermo stretto si adatta alla larghezza (si scrive più grande e si scorre),
  // su schermo largo si vede tutta la pagina
  const stretto = r.width < 560;
  const z = stretto ? zLargh : Math.min(zLargh, (r.height - padSopra - padSotto) / P.h);
  stato.vista.zoom = z;
  stato.vista.x = (r.width - P.w * z) / 2;
  stato.vista.y = stretto ? padSopra
                          : padSopra + Math.max(0, (r.height - padSopra - padSotto - P.h * z) / 2);
  aggiornaEtichettaZoom();
  rigeneraLayer();
  richiediRender(); richiediSovra();
}
function impostaZoom(z, cx, cy){
  const P = pag(); if (!P) return;
  const v = stato.vista;
  const r = rettArea();
  if (cx == null){ cx = r.width / 2; cy = r.height / 2; }
  const nz = clamp(z, 0.12, 9);
  const px = (cx - v.x) / v.zoom, py = (cy - v.y) / v.zoom;
  v.zoom = nz;
  v.x = cx - px * nz; v.y = cy - py * nz;
  aggiornaEtichettaZoom();
  richiediRender(); richiediSovra();
  rigeneraLayerLento();
}
const rigeneraLayerLento = debounce(() => {
  if (Math.abs(scalaLayerIdeale() - layerScala) > 0.05){ rigeneraLayer(); richiediRender(); }
}, 220);
function aggiornaEtichettaZoom(){
  $('#b-zoom-fit').textContent = Math.round(stato.vista.zoom * 100) + '%';
}

async function aggiungiPagina(opz){
  const P = pag();
  const nuova = nuovaPagina(stato.quaderno.id, Object.assign({
    ordine: stato.iPagina + 1, modello: P ? P.modello : 'righe', carta: P ? P.carta : 'bianco'
  }, opz || {}));
  stato.pagine.splice(stato.iPagina + 1, 0, nuova);
  stato.pagine.forEach((p, i) => { p.ordine = i; daSalvare.set(p.id, p); });

  pianificaSalvataggio(nuova);
  await vaiAPagina(stato.iPagina + 1);

async function duplicaPagina(){
  const P = pag();
  const copia = JSON.parse(JSON.stringify(P));
  copia.id = uid('p_'); copia.creato = Date.now();
  copia.tratti.forEach(t => t.id = uid('t_'));
  (copia.oggetti || []).forEach(o => o.id = uid('o_'));
  copia.ordine = stato.iPagina + 1;
  stato.pagine.splice(stato.iPagina + 1, 0, copia);
  stato.pagine.forEach((p, i) => { p.ordine = i; daSalvare.set(p.id, p); });
  pianificaSalvataggio(copia);
  await vaiAPagina(stato.iPagina + 1);
  toast('Pagina duplicata');
}
async function eliminaPagina(){
  if (stato.pagine.length <= 1){ toast('Non puoi eliminare l’unica pagina', 'err'); return; }
  if (!await conferma('La pagina e tutto quello che contiene verranno eliminati. L’operazione non si può annullare.', { titolo:'Eliminare la pagina?', ok:'Elimina', pericolo:true })) return;
  const P = pag();
  if (P.sfondo) await archivio.elimina('asset', P.sfondo).catch(() => {});
  for (const o of (P.oggetti || [])) if (o.asset) await archivio.elimina('asset', o.asset).catch(() => {});
  await archivio.elimina('pagine', P.id);
  stato.pagine.splice(stato.iPagina, 1);
  stato.pagine.forEach((p, i) => { p.ordine = i; daSalvare.set(p.id, p); });
  stato.storia = stato.storia.filter(o => o.pg !== P.id);
  stato.futuro = stato.futuro.filter(o => o.pg !== P.id);
  pianificaSalvataggio(stato.pagine[0]);
  await vaiAPagina(Math.min(stato.iPagina, stato.pagine.length - 1));
  aggiornaBottoniStoria();
}

/* ============================================================
   16. Ingresso: penna, dito, mouse
   ============================================================ */
let lazoPunti = null, cursoreGomma = null, guidaForma = null;
const puntatori = new Map();
let penVisto = false;
let modo = null;              // disegno | pan | pinch | lazo | gomma | forma | sposta | scala
let panDa = null, pinch = null, formaDa = null, trasfDa = null;
let ultimoPt = null, ultimoTempo = 0, pLisc = 0.8, fermoDa = 0;
let scattoTratti = null;      // fotografia dei tratti a inizio gesto (gomma/lazo)
let gommaPrec = null;         // posizione precedente della gomma, per cancellare in continuo
let spazioPremuto = false;

function pressioneDa(e, pt){
  const ora = performance.now();
  if (e.pointerType === 'pen' && e.pressure > 0 && e.pressure < 1){
    pLisc = pLisc * 0.5 + e.pressure * 0.5;
    return clamp(pLisc, 0.04, 1);
  }
  if (e.pointerType === 'pen' && e.pressure >= 1) return 1;
  let p = 0.8;
  if (ultimoPt){
    const dt = Math.max(4, ora - ultimoTempo);
    const d  = Math.hypot(pt.x - ultimoPt.x, pt.y - ultimoPt.y);
    p = clamp(1 - (d / dt) / 2.4, 0.45, 1);
  }
  pLisc = pLisc * 0.68 + p * 0.32;
  return pLisc;
}

function dentroPagina(pt){
  const P = pag();
  return pt.x >= -40 && pt.y >= -40 && pt.x <= P.w + 40 && pt.y <= P.h + 40;
}

area.addEventListener('pointerdown', e => {
  // i pannelli sovrapposti al foglio non devono lasciare segni sulla pagina
  if (e.target.closest('.pagine-drawer, .dock, .opzioni, .sel-menu, #editor-testo')) return;
  if (e.pointerType === 'pen') penVisto = true;
  puntatori.set(e.pointerId, { x:e.clientX, y:e.clientY, tipo:e.pointerType });
  area.setPointerCapture(e.pointerId);

  if (puntatori.size === 2){ annullaGesto(); iniziaPinch(); return; }
  if (puntatori.size > 2) return;

  const pt = versoPagina(e.clientX, e.clientY);
  ultimoPt = null; ultimoTempo = performance.now(); pLisc = 0.8; fermoDa = performance.now();

  // gesti che spostano la vista
  const ditoDaScartare = e.pointerType === 'touch' && stato.config.soloPenna && penVisto;
  if (stato.strumento === 'mano' || ditoDaScartare || spazioPremuto || e.button === 1){
    modo = 'pan';
    panDa = { x:e.clientX, y:e.clientY, vx:stato.vista.x, vy:stato.vista.y };
    return;
  }
  if (e.button === 2) return;

  // punta gomma della penna
  const gommaHw = e.pointerType === 'pen' && (e.buttons & 32);
  const str = gommaHw ? 'gomma' : stato.strumento;
  chiudiEditorTesto();

  switch (str){
    case 'penna':
    case 'evidenziatore': {
      if (!dentroPagina(pt)) { modo = 'pan'; panDa = { x:e.clientX, y:e.clientY, vx:stato.vista.x, vy:stato.vista.y }; return; }
      modo = 'disegno';
      chiudiPannelloOpzioni();     // appena si comincia a scrivere il pannello si tolge di mezzo
      const cfg = str === 'penna' ? stato.penna : stato.evidenziatore;
      trattoVivo = { id:uid('t_'), t: str === 'penna' ? 'pen' : 'evid', c:cfg.colore, w:cfg.dim, pts:[pt.x, pt.y, pressioneDa(e, pt)] };
      ultimoPt = pt;
      richiediRender();
      break;
    }
    case 'gomma': {
      modo = 'gomma';
      scattoTratti = pag().tratti.slice();
      cursoreGomma = pt; gommaPrec = null;
      cancellaIn(pt);
      gommaPrec = pt;
      richiediSovra();
      break;
    }
    case 'lazo': {
      const sel = stato.selezione;
      if (sel && sel.bbox){
        const b = sel.bbox, tol = 14 / stato.vista.zoom;
        if (Math.abs(pt.x - (b.x + b.w)) < tol && Math.abs(pt.y - (b.y + b.h)) < tol){
          modo = 'scala'; trasfDa = { pt, bbox:Object.assign({}, b), orig: istantaneaSelezione() };
          return;
        }
        if (pt.x > b.x && pt.x < b.x + b.w && pt.y > b.y && pt.y < b.y + b.h){
          modo = 'sposta'; trasfDa = { pt, orig: istantaneaSelezione() };
          return;
        }
      }
      deseleziona();
      modo = 'lazo'; lazoPunti = [pt.x, pt.y];
      break;
    }
    case 'forme': {
      modo = 'forma'; formaDa = pt;
      break;
    }
    case 'testo': {
      const o = oggettoIn(pt, 'testo');
      if (o) apriEditorTesto(o, false);
      else {
        const P = pag();
        const nuovo = {
          id: uid('o_'), tipo:'testo', x: clamp(pt.x, 40, P.w - 120), y: pt.y,
          w: Math.min(600, P.w - clamp(pt.x, 40, P.w - 120) - 40),
          dim: stato.testo.dim, colore: stato.testo.colore, grassetto:false, testo:''
        };
        apriEditorTesto(nuovo, true);
      }
      modo = null;
      break;
    }
    case 'immagine': {
      const o = oggettoIn(pt, 'immagine');
      if (o){ selezionaOggetto(o); modo = null; break; }
      posizioneImmagine = pt;
      $('#file-immagine').click();
      modo = null;
      break;
    }
  }
});

window.addEventListener('pointermove', e => {
  if (puntatori.has(e.pointerId)) puntatori.set(e.pointerId, { x:e.clientX, y:e.clientY, tipo:e.pointerType });

  if (modo === 'pinch'){ muoviPinch(); return; }
  if (modo === 'pan'){
    stato.vista.x = panDa.vx + (e.clientX - panDa.x);
    stato.vista.y = panDa.vy + (e.clientY - panDa.y);
    richiediRender(); richiediSovra();
    return;
  }
  if (stato.strumento === 'gomma' && !modo){
    cursoreGomma = versoPagina(e.clientX, e.clientY);
    richiediSovra();
    return;
  }
  if (!modo) return;

  const eventi = (e.getCoalescedEvents && modo === 'disegno') ? e.getCoalescedEvents() : [e];

  if (modo === 'disegno'){
    for (const ev of eventi){
      const pt = versoPagina(ev.clientX, ev.clientY);
      const n = trattoVivo.pts.length;
      const dx = pt.x - trattoVivo.pts[n-3], dy = pt.y - trattoVivo.pts[n-2];
      const d = Math.hypot(dx, dy);
      if (d < 0.7) continue;
      if (d > 2.5) fermoDa = performance.now();
      trattoVivo.pts.push(pt.x, pt.y, pressioneDa(ev, pt));
      ultimoPt = pt; ultimoTempo = performance.now();
    }
    richiediRender();
    return;
  }
  if (modo === 'gomma'){
    const pt = versoPagina(e.clientX, e.clientY);
    cursoreGomma = pt;
    cancellaIn(pt, gommaPrec);
    gommaPrec = pt;
    richiediSovra();
    return;
  }
  if (modo === 'lazo'){
    const pt = versoPagina(e.clientX, e.clientY);
    const n = lazoPunti.length;
    if (Math.hypot(pt.x - lazoPunti[n-2], pt.y - lazoPunti[n-1]) > 3){
      lazoPunti.push(pt.x, pt.y);
      richiediSovra();
    }
    return;
  }
  if (modo === 'forma'){
    const pt = versoPagina(e.clientX, e.clientY);
    guidaForma = percorsoForma(formaDa, pt, e.shiftKey);
    richiediSovra();
    return;
  }
  if (modo === 'sposta' || modo === 'scala'){
    const pt = versoPagina(e.clientX, e.clientY);
    if (modo === 'sposta') applicaTrasformazione(pt.x - trasfDa.pt.x, pt.y - trasfDa.pt.y, 1);
    else {
      const b = trasfDa.bbox;
      const sx = (pt.x - b.x) / Math.max(8, b.w), sy = (pt.y - b.y) / Math.max(8, b.h);
      applicaTrasformazione(0, 0, clamp(Math.max(sx, sy), 0.1, 8));
    }
    return;
  }
});

function finePuntatore(e){
  puntatori.delete(e.pointerId);
  if (modo === 'pinch'){
    if (puntatori.size < 2){ pinch = null; modo = null; rigeneraLayerLento(); }
    return;
  }
  if (!modo){ if (stato.strumento !== 'gomma'){ cursoreGomma = null; richiediSovra(); } return; }

  if (modo === 'disegno' && trattoVivo){
    let t = trattoVivo; trattoVivo = null;
    if (t.pts.length >= 3){
      if (t.t === 'pen' && stato.config.formeAuto && performance.now() - fermoDa > 420 && t.pts.length > 18){
        const raddrizzato = riconosciForma(t.pts);
        if (raddrizzato) t.pts = raddrizzato;
      }
      t.pts = arrotondaPunti(t.pts);
      const P = pag();
      P.tratti.push(t);
      azione({ t:'at', tratti:[t] });
      aggiungiALayer(t);
      pianificaSalvataggio(P);
      aggiornaMiniature();
    }
    richiediRender();
  }
  else if (modo === 'gomma'){
    chiudiGesto();
    cursoreGomma = null; gommaPrec = null;
  }
  else if (modo === 'lazo'){
    concludiLazo();
  }
  else if (modo === 'forma'){
    const pt = versoPagina(e.clientX, e.clientY);
    creaForma(formaDa, pt, e.shiftKey);
    guidaForma = null; formaDa = null;
  }
  else if (modo === 'sposta' || modo === 'scala'){
    concludiTrasformazione();
  }
  modo = null; panDa = null;
  richiediSovra();
}
window.addEventListener('pointerup', finePuntatore);
window.addEventListener('pointercancel', finePuntatore);

function annullaGesto(){
  if (modo === 'disegno'){ trattoVivo = null; richiediRender(); }
  if (modo === 'lazo'){ lazoPunti = null; }
  if (modo === 'forma'){ guidaForma = null; formaDa = null; }
  modo = null;
}

/* --- zoom a due dita --- */
function coppia(){
  const a = Array.from(puntatori.values());
  return [a[0], a[1]];
}
function iniziaPinch(){
  const [a, b] = coppia(); if (!a || !b) return;
  const r = rettArea();
  const cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top;
  const v = stato.vista;
  pinch = {
    d: Math.hypot(a.x - b.x, a.y - b.y) || 1,
    zoom0: v.zoom,
    px: (cx - v.x) / v.zoom, py: (cy - v.y) / v.zoom
  };
  modo = 'pinch';
}
function muoviPinch(){
  if (!pinch) return;
  const [a, b] = coppia(); if (!a || !b) return;
  const r = rettArea();
  const cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top;
  const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
  const v = stato.vista;
  v.zoom = clamp(pinch.zoom0 * (d / pinch.d), 0.12, 9);
  v.x = cx - pinch.px * v.zoom;
  v.y = cy - pinch.py * v.zoom;
  aggiornaEtichettaZoom();
  richiediRender(); richiediSovra();
}

/* --- rotella e tastiera --- */
area.addEventListener('wheel', e => {
  e.preventDefault();
  const r = rettArea();
  if (e.ctrlKey || e.metaKey){
    impostaZoom(stato.vista.zoom * Math.pow(0.9988, e.deltaY * 3), e.clientX - r.left, e.clientY - r.top);
  } else {
    stato.vista.x -= e.deltaX;
    stato.vista.y -= e.deltaY;
    richiediRender(); richiediSovra();
  }
}, { passive:false });

window.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, [contenteditable]')) {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (!stato.quaderno) return;
  const cmd = e.ctrlKey || e.metaKey;
  if (e.code === 'Space'){ spazioPremuto = true; area.style.cursor = 'grab'; }
  if (cmd && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? ripeti() : annulla(); return; }
  if (cmd && e.key.toLowerCase() === 'y'){ e.preventDefault(); ripeti(); return; }
  if (cmd && e.key.toLowerCase() === 's'){ e.preventDefault(); salvaSubito(); toast('Salvato'); return; }
  if (cmd && e.key.toLowerCase() === 'd'){ e.preventDefault(); duplicaSelezione(); return; }
  if (e.key === 'Escape'){ deseleziona(); chiudiPannelloOpzioni(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && stato.selezione){ e.preventDefault(); eliminaSelezione(); return; }
  if (e.key === 'PageDown' || (e.key === 'ArrowRight' && !stato.selezione)) vaiAPagina(stato.iPagina + 1);
  if (e.key === 'PageUp'   || (e.key === 'ArrowLeft'  && !stato.selezione)) vaiAPagina(stato.iPagina - 1);
  const tasti = { '1':'penna','2':'evidenziatore','3':'gomma','4':'lazo','5':'forme','6':'testo','7':'immagine','0':'mano' };
  if (tasti[e.key]) impostaStrumento(tasti[e.key]);
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space'){ spazioPremuto = false; area.style.cursor = ''; }
});

/* ============================================================
   17. Gomma
   ============================================================ */
function bboxTratto(t){
  if (t._bb) return t._bb;
  const p = t.pts; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < p.length; i += 3){
    if (p[i] < x0) x0 = p[i]; if (p[i] > x1) x1 = p[i];
    if (p[i+1] < y0) y0 = p[i+1]; if (p[i+1] > y1) y1 = p[i+1];
  }
  const m = t.w;
  return (t._bb = { x:x0 - m, y:y0 - m, w:(x1 - x0) + m * 2, h:(y1 - y0) + m * 2 });
}
function distSegmento(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  if (!l2) return Math.hypot(px - ax, py - ay);
  let k = ((px - ax) * dx + (py - ay) * dy) / l2;
  k = k < 0 ? 0 : (k > 1 ? 1 : k);
  return Math.hypot(px - (ax + k * dx), py - (ay + k * dy));
}
/* cancella lungo il tratto percorso dalla gomma, non solo nel punto di arrivo:
   con movimenti rapidi i campioni sono distanti e senza interpolazione si "salterebbero" pezzi */
function cancellaIn(pt, prec){
  const r = stato.gomma.dim / 2;
  if (prec){
    const d = Math.hypot(pt.x - prec.x, pt.y - prec.y);
    const passi = Math.min(24, Math.ceil(d / Math.max(2, r * 0.6)));
    for (let i = 1; i <= passi; i++)
      cancellaPunto(prec.x + (pt.x - prec.x) * i / passi, prec.y + (pt.y - prec.y) * i / passi, r);
    if (passi > 0) return;
  }
  cancellaPunto(pt.x, pt.y, r);
}
function cancellaPunto(cx, cy, r){
  const P = pag();
  let cambiato = false;
  for (let i = P.tratti.length - 1; i >= 0; i--){
    const t = P.tratti[i];
    const b = bboxTratto(t);
    if (cx < b.x - r || cy < b.y - r || cx > b.x + b.w + r || cy > b.y + b.h + r) continue;
    if (stato.gomma.modo === 'tratto'){
      if (toccaTratto(t, cx, cy, r)){ P.tratti.splice(i, 1); cambiato = true; }
    } else {
      const parti = spezzaPerGomma(t, cx, cy, r);
      if (parti){
        P.tratti.splice(i, 1);
        for (const s of parti) P.tratti.push(s);
        cambiato = true;
      }
    }
  }
  if (cambiato){ rigeneraLayer(); richiediRender(); }
}
function toccaTratto(t, cx, cy, r){
  const p = t.pts, n = p.length / 3, s = r + t.w / 2;
  if (n === 1) return Math.hypot(p[0] - cx, p[1] - cy) <= s;
  for (let i = 1; i < n; i++)
    if (distSegmento(cx, cy, p[(i-1)*3], p[(i-1)*3+1], p[i*3], p[i*3+1]) <= s) return true;
  return false;
}
/* aggiunge punti intermedi dove i vertici sono più distanti del passo indicato:
   serve alla gomma parziale, altrimenti un tratto con due soli vertici non si può spezzare */
function densifica(p, passo){
  const n = p.length / 3;
  if (n < 2) return p;
  const out = [p[0], p[1], p[2]];
  for (let i = 1; i < n; i++){
    const ax = p[(i-1)*3], ay = p[(i-1)*3+1], ap = p[(i-1)*3+2];
    const bx = p[i*3],     by = p[i*3+1],     bp = p[i*3+2];
    const k = Math.min(200, Math.ceil(Math.hypot(bx - ax, by - ay) / passo));
    for (let j = 1; j <= Math.max(1, k); j++){
      const q = j / Math.max(1, k);
      out.push(ax + (bx - ax) * q, ay + (by - ay) * q, ap + (bp - ap) * q);
    }
  }
  return out;
}
function vertRadi(p, passo){
  for (let i = 3; i < p.length; i += 3)
    if (Math.hypot(p[i] - p[i-3], p[i+1] - p[i-2]) > passo) return true;
  return false;
}
function spezzaPerGomma(t, cx, cy, r){
  const s = r + t.w / 2;
  const passo = Math.max(1.5, s * 0.45);
  const p = vertRadi(t.pts, passo) ? densifica(t.pts, passo) : t.pts;
  const n = p.length / 3;
  const fuori = new Array(n);
  let toccato = false;
  for (let i = 0; i < n; i++){
    fuori[i] = Math.hypot(p[i*3] - cx, p[i*3+1] - cy) > s;
    if (!fuori[i]) toccato = true;
  }
  // un segmento può passare dentro la gomma anche con i due estremi fuori
  const taglia = new Array(Math.max(0, n - 1)).fill(false);
  for (let i = 1; i < n; i++){
    if (!fuori[i] || !fuori[i-1]) continue;
    if (distSegmento(cx, cy, p[(i-1)*3], p[(i-1)*3+1], p[i*3], p[i*3+1]) <= s){ taglia[i-1] = true; toccato = true; }
  }
  if (!toccato) return null;
  const parti = [];
  let corrente = null;
  const chiudi = () => {
    if (corrente && corrente.length >= 6) parti.push({ id:uid('t_'), t:t.t, c:t.c, w:t.w, pts:corrente });
    corrente = null;
  };
  for (let i = 0; i < n; i++){
    if (!fuori[i]){ chiudi(); continue; }
    if (!corrente) corrente = [];
    corrente.push(p[i*3], p[i*3+1], p[i*3+2]);
    if (taglia[i]) chiudi();
  }
  chiudi();
  return parti;
}
function chiudiGesto(){
  const P = pag();
  if (!scattoTratti) return;
  const prima = scattoTratti; scattoTratti = null;
  const oraSet = new Set(P.tratti.map(t => t.id));
  const primaSet = new Set(prima.map(t => t.id));
  const voci = [], nuovi = [];
  prima.forEach((t, i) => { if (!oraSet.has(t.id)) voci.push({ i, t }); });
  P.tratti.forEach(t => { if (!primaSet.has(t.id)) nuovi.push(t); });
  if (!voci.length && !nuovi.length) return;
  azione({ t:'st', voci, nuovi });
  pianificaSalvataggio(P);
  aggiornaMiniature();
}

/* ============================================================
   18. Forme e riconoscimento
   ============================================================ */
function percorsoForma(a, b, vincola){
  const p = new Path2D();
  let x1 = b.x, y1 = b.y;
  if (vincola){
    if (stato.forma === 'linea' || stato.forma === 'freccia'){
      if (Math.abs(b.x - a.x) > Math.abs(b.y - a.y)) y1 = a.y; else x1 = a.x;
    } else {
      const d = Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y));
      x1 = a.x + Math.sign(b.x - a.x) * d; y1 = a.y + Math.sign(b.y - a.y) * d;
    }
  }
  const f = stato.forma;
  if (f === 'linea' || f === 'freccia'){ p.moveTo(a.x, a.y); p.lineTo(x1, y1); }
  else if (f === 'rettangolo') p.rect(Math.min(a.x, x1), Math.min(a.y, y1), Math.abs(x1 - a.x), Math.abs(y1 - a.y));
  else if (f === 'ellisse') p.ellipse((a.x + x1) / 2, (a.y + y1) / 2, Math.abs(x1 - a.x) / 2, Math.abs(y1 - a.y) / 2, 0, 0, 6.2832);
  else if (f === 'triangolo'){ p.moveTo((a.x + x1) / 2, a.y); p.lineTo(x1, y1); p.lineTo(a.x, y1); p.closePath(); }
  return p;
}
function puntiForma(a, b, vincola){
  let x1 = b.x, y1 = b.y;
  if (vincola){
    if (stato.forma === 'linea' || stato.forma === 'freccia'){
      if (Math.abs(b.x - a.x) > Math.abs(b.y - a.y)) y1 = a.y; else x1 = a.x;
    } else {
      const d = Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y));
      x1 = a.x + Math.sign(b.x - a.x) * d; y1 = a.y + Math.sign(b.y - a.y) * d;
    }
  }
  const out = [];
  const add = (x, y) => out.push(x, y, 1);
  const seg = (xa, ya, xb, yb, passi) => { for (let i = 0; i <= passi; i++) add(xa + (xb - xa) * i / passi, ya + (yb - ya) * i / passi); };
  const f = stato.forma;
  const X0 = Math.min(a.x, x1), Y0 = Math.min(a.y, y1), W = Math.abs(x1 - a.x), H = Math.abs(y1 - a.y);
  if (f === 'linea'){ seg(a.x, a.y, x1, y1, 12); }
  else if (f === 'freccia'){
    seg(a.x, a.y, x1, y1, 12);
    const ang = Math.atan2(y1 - a.y, x1 - a.x), L = Math.min(34, Math.hypot(x1 - a.x, y1 - a.y) * 0.3);
    seg(x1, y1, x1 - L * Math.cos(ang - 0.42), y1 - L * Math.sin(ang - 0.42), 5);
    seg(x1 - L * Math.cos(ang - 0.42), y1 - L * Math.sin(ang - 0.42), x1, y1, 5);
    seg(x1, y1, x1 - L * Math.cos(ang + 0.42), y1 - L * Math.sin(ang + 0.42), 5);
  }
  else if (f === 'rettangolo'){ seg(X0, Y0, X0 + W, Y0, 10); seg(X0 + W, Y0, X0 + W, Y0 + H, 10); seg(X0 + W, Y0 + H, X0, Y0 + H, 10); seg(X0, Y0 + H, X0, Y0, 10); }
  else if (f === 'triangolo'){ seg(X0 + W / 2, Y0, X0 + W, Y0 + H, 10); seg(X0 + W, Y0 + H, X0, Y0 + H, 10); seg(X0, Y0 + H, X0 + W / 2, Y0, 10); }
  else if (f === 'ellisse'){
    const cx = X0 + W / 2, cy = Y0 + H / 2, rx = W / 2, ry = H / 2, N = 64;
    for (let i = 0; i <= N; i++){ const t = i / N * 6.2832; add(cx + rx * Math.cos(t), cy + ry * Math.sin(t)); }
  }
  return out;
}
function creaForma(a, b, vincola){
  if (!a || !b) return;
  if (Math.hypot(b.x - a.x, b.y - a.y) < 6) return;
  const P = pag();
  const t = { id:uid('t_'), t:'pen', c:stato.penna.colore, w:stato.penna.dim * 1.05, pts: puntiForma(a, b, vincola) };
  P.tratti.push(t);
  azione({ t:'at', tratti:[t] });
  aggiungiALayer(t);
  pianificaSalvataggio(P);
  richiediRender(); aggiornaMiniature();
}
/* riconoscimento: linea, cerchio, rettangolo, triangolo */
function riconosciForma(pts){
  const n = pts.length / 3;
  if (n < 8) return null;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, lung = 0;
  for (let i = 0; i < n; i++){
    const x = pts[i*3], y = pts[i*3+1];
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
    if (i) lung += Math.hypot(x - pts[(i-1)*3], y - pts[(i-1)*3+1]);
  }
  const W = x1 - x0, H = y1 - y0, diag = Math.hypot(W, H);
  if (diag < 22) return null;
  const ax = pts[0], ay = pts[1], bx = pts[(n-1)*3], by = pts[(n-1)*3+1];
  const capi = Math.hypot(bx - ax, by - ay);
  const salva = stato.forma;
  let out = null;
  if (capi > lung * 0.86){                       // quasi dritto -> linea
    stato.forma = 'linea';
    out = puntiForma({ x:ax, y:ay }, { x:bx, y:by }, false);
  } else if (capi < diag * 0.28){                // chiuso
    // area del poligono per distinguere cerchio / rettangolo
    let area = 0;
    for (let i = 0; i < n; i++){
      const j = (i + 1) % n;
      area += pts[i*3] * pts[j*3+1] - pts[j*3] * pts[i*3+1];
    }
    area = Math.abs(area) / 2;
    const riempimento = area / Math.max(1, W * H);
    stato.forma = riempimento > 0.87 ? 'rettangolo' : (riempimento > 0.6 ? 'ellisse' : null);
    if (stato.forma) out = puntiForma({ x:x0, y:y0 }, { x:x1, y:y1 }, false);
  }
  stato.forma = salva;
  return out;
}
function arrotondaPunti(p){
  const out = new Array(p.length);
  for (let i = 0; i < p.length; i += 3){
    out[i]   = Math.round(p[i] * 10) / 10;
    out[i+1] = Math.round(p[i+1] * 10) / 10;
    out[i+2] = Math.round(p[i+2] * 100) / 100;
  }
  return out;
}

/* ============================================================
   19. Selezione (lazo)
   ============================================================ */
function dentroPoligono(x, y, poli){
  let dentro = false;
  for (let i = 0, j = poli.length - 2; i < poli.length; j = i, i += 2){
    const xi = poli[i], yi = poli[i+1], xj = poli[j], yj = poli[j+1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi + 1e-9) + xi)) dentro = !dentro;
  }
  return dentro;
}
function concludiLazo(){
  const poli = lazoPunti; lazoPunti = null;
  if (!poli || poli.length < 8){ richiediSovra(); return; }
  const P = pag();
  const tratti = [], oggetti = [];
  for (const t of P.tratti){
    const n = t.pts.length / 3;
    let dentro = 0;
    for (let i = 0; i < n; i++) if (dentroPoligono(t.pts[i*3], t.pts[i*3+1], poli)) dentro++;
    if (dentro / n > 0.62) tratti.push(t.id);
  }
  for (const o of P.oggetti){
    const b = bboxOggetto(o);
    if (dentroPoligono(b.x + b.w / 2, b.y + b.h / 2, poli)) oggetti.push(o.id);
  }
  if (!tratti.length && !oggetti.length){ deseleziona(); return; }
  stato.selezione = { tratti, oggetti, bbox: bboxSelezione(tratti, oggetti) };
  mostraMenuSelezione();
  richiediSovra();
}
function bboxSelezione(tratti, oggetti){
  const P = pag();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const inc = b => { x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); };
  tratti.forEach(id => { const t = P.tratti.find(x => x.id === id); if (t) inc(bboxTratto(t)); });
  oggetti.forEach(id => { const o = P.oggetti.find(x => x.id === id); if (o) inc(bboxOggetto(o)); });
  if (x0 > x1) return null;
  return { x:x0 - 6, y:y0 - 6, w:(x1 - x0) + 12, h:(y1 - y0) + 12 };
}
function selezionaOggetto(o){

function applicaTrasformazione(dx, dy, scala){
  const P = pag(), o0 = trasfDa.orig, b = o0.bbox;
  for (const v of o0.tratti){
    const t = P.tratti.find(x => x.id === v.id); if (!t) continue;
    const np = new Array(v.pts.length);
    for (let i = 0; i < v.pts.length; i += 3){
      np[i]   = b.x + (v.pts[i] - b.x) * scala + dx;
      np[i+1] = b.y + (v.pts[i+1] - b.y) * scala + dy;
      np[i+2] = v.pts[i+2];
    }
    t.pts = np; t._bb = null;
  }
  for (const v of o0.oggetti){
    const o = P.oggetti.find(x => x.id === v.id); if (!o) continue;
    o.x = b.x + (v.x - b.x) * scala + dx;
    o.y = b.y + (v.y - b.y) * scala + dy;
    if (o.tipo === 'immagine'){ o.w = v.w * scala; o.h = v.h * scala; }
    else { o.w = v.w * scala; o.dim = v.dim * scala; }
  }
  stato.selezione.bbox = { x:b.x + dx, y:b.y + dy, w:b.w * scala, h:b.h * scala };
  rigeneraLayer(); richiediRender(); richiediSovra(); posizionaMenuSelezione();
}
function concludiTrasformazione(){
  const P = pag(), o0 = trasfDa && trasfDa.orig; trasfDa = null;
  if (!o0) return;
  const voci = o0.tratti.map(v => ({ id:v.id, prima:{ pts:v.pts } }));
  const vociO = o0.oggetti.map(v => ({ id:v.id, prima:{ x:v.x, y:v.y, w:v.w, h:v.h, dim:v.dim } }));
  if (voci.length) azione({ t:'mt', voci });

  pianificaSalvataggio(P); aggiornaMiniature(); richiediSovra();
}
function eliminaSelezione(){
  const sel = stato.selezione; if (!sel) return;

  P.tratti.forEach((t, i) => { if (sel.tratti.includes(t.id)) voci.push({ i, t }); });
  P.oggetti.forEach((o, i) => { if (sel.oggetti.includes(o.id)) vociO.push({ i, o }); });
  P.tratti = P.tratti.filter(t => !sel.tratti.includes(t.id));

function duplicaSelezione(){
  const sel = stato.selezione; if (!sel) return;
  const P = pag(), d = 26;
  const nt = [], no = [];
  sel.tratti.forEach(id => {
    const t = P.tratti.find(x => x.id === id); if (!t) return;
    const c = { id:uid('t_'), t:t.t, c:t.c, w:t.w, pts:t.pts.slice() };
    for (let i = 0; i < c.pts.length; i += 3){ c.pts[i] += d; c.pts[i+1] += d; }
    nt.push(c);
  });
  sel.oggetti.forEach(id => {
    const o = P.oggetti.find(x => x.id === id); if (!o) return;
    const c = Object.assign({}, o, { id:uid('o_'), x:o.x + d, y:o.y + d });
    no.push(c);
  });
  P.tratti = P.tratti.concat(nt);
  P.oggetti = P.oggetti.concat(no);
  if (nt.length) azione({ t:'at', tratti:nt });
  if (no.length) azione({ t:'ao', oggetti:no });
  stato.selezione = { tratti:nt.map(t => t.id), oggetti:no.map(o => o.id), bbox:null };
  stato.selezione.bbox = bboxSelezione(stato.selezione.tratti, stato.selezione.oggetti);
  rigeneraLayer(); richiediRender(); richiediSovra(); posizionaMenuSelezione();
  pianificaSalvataggio(P); aggiornaMiniature();
}
function coloraSelezione(){

async function inserisciImmagine(file, pt){
  const P = pag(); if (!P) return;
  try {
    const blob = await comprimiImmagine(file, 1800, 0.86);
    const id = await salvaAsset(blob);
    const img = await caricaAsset(id);
    const maxW = Math.min(P.w * 0.7, 620);
    const scala = Math.min(maxW / img.width, (P.h * 0.6) / img.height, 1);
    const w = img.width * scala, h = img.height * scala;
    const x = pt ? clamp(pt.x - w / 2, 10, P.w - w - 10) : (P.w - w) / 2;
    const y = pt ? clamp(pt.y - h / 2, 10, P.h - h - 10) : 80;
    const o = { id:uid('o_'), tipo:'immagine', x, y, w, h, asset:id };
    P.oggetti.push(o);
    azione({ t:'ao', oggetti:[o] });
    richiediRender(); pianificaSalvataggio(P); aggiornaMiniature();
    selezionaOggetto(o);
    impostaStrumento('lazo');
  } catch(err){ toast('Immagine non caricata: ' + err.message, 'err'); }
}
function comprimiImmagine(file, maxLato, qualita){
  return new Promise((ris, rif) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const s = Math.min(1, maxLato / Math.max(im.width, im.height));
      if (s === 1 && file.size < 900000) return ris(file);
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => b ? ris(b) : rif(new Error('conversione fallita')), 'image/jpeg', qualita);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rif(new Error('formato non supportato')); };
    im.src = url;
  });
}
