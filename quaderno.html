/* ============================================================
   21. Contenuti impaginati (pagine generate dall'IA)
   ============================================================ */
const MRG = { x:82, alto:92, basso:86 };

function inchiostroPer(P){
  return (P.carta === 'notte') ? { fg:'#ecead5', fg2:'#b9b6ae', linea:'#43434f', box:'#2c2c36' }
                               : { fg:'#16161a', fg2:'#55524b', linea:'#d8d3c8', box:'#f3efe4' };
}
function testoRicco(ctx, testo, x, y, larg, dim, colore, grassetto, corsivo, disegna, interlinea){
  // supporta **grassetto** dentro il testo
  const pezzi = String(testo || '').split(/(\*\*[^*]+\*\*)/g).filter(s => s !== '');
  const parole = [];
  pezzi.forEach(p => {
    const b = p.startsWith('**') && p.endsWith('**') && p.length > 4;
    const t = b ? p.slice(2, -2) : p;
    t.split(/(\s+)/).forEach(w => { if (w !== '') parole.push({ w, b: b || grassetto }); });
  });
  const li = interlinea || 1.48;
  let cx = x, cy = y, righe = 1;
  for (const p of parole){
    ctx.font = fontPer(dim, p.b, corsivo);
    const lw = ctx.measureText(p.w).width;
    if (/^\s+$/.test(p.w)){
      if (cx > x) cx += lw;
      continue;
    }
    if (cx + lw > x + larg && cx > x){ cx = x; cy += dim * li; righe++; }
    if (disegna){ ctx.fillStyle = colore; ctx.fillText(p.w, cx, cy); }
    cx += lw;
  }
  return righe * dim * li;
}

/* disegna o misura un blocco; restituisce l'altezza occupata */
function blocco(ctx, b, y, P, disegna){
  const ink = inchiostroPer(P);
  const x = MRG.x, larg = P.w - MRG.x * 2;
  const T = (b.testo || '').trim();
  if (disegna) ctx.textBaseline = 'top';
  let h = 0;
  switch (b.tipo){
    case 'titolo': {
      h = testoRicco(ctx, T, x, y, larg, 40, ink.fg, true, false, disegna, 1.25) + 16;
      if (disegna){
        ctx.fillStyle = '#4c5fd7';
        ctx.fillRect(x, y + h - 12, Math.min(larg, 72), 4);
      }
      return h + 14;
    }
    case 'sottotitolo':
      h = testoRicco(ctx, T, x, y + 10, larg, 28, ink.fg, true, false, disegna, 1.3);
      return h + 22;
    case 'paragrafo':
      return testoRicco(ctx, T, x, y, larg, 23, ink.fg, false, false, disegna, 1.52) + 14;
    case 'citazione': {
      h = testoRicco(ctx, T, x + 22, y, larg - 22, 22, ink.fg2, false, true, disegna, 1.5);
      if (disegna){ ctx.fillStyle = '#4c5fd7'; ctx.fillRect(x, y, 4, h - 6); }
      return h + 16;
    }
    case 'elenco':
    case 'elenco_numerato': {
      const voci = (b.voci && b.voci.length) ? b.voci : (T ? [T] : []);
      let yy = y;
      voci.forEach((v, i) => {
        const seg = b.tipo === 'elenco' ? '•' : (i + 1) + '.';
        if (disegna){
          ctx.font = fontPer(22, true);
          ctx.fillStyle = '#4c5fd7';
          ctx.fillText(seg, x + 4, yy + 1);
        }
        yy += testoRicco(ctx, v, x + 36, yy, larg - 36, 22, ink.fg, false, false, disegna, 1.5) + 8;
      });
      return (yy - y) + 8;
    }
    case 'definizione':
    case 'evidenzia': {
      const evid = b.tipo === 'evidenzia';
      const pad = 16, ix = x + pad + 8, iw = larg - pad * 2 - 8;
      const hTit = b.titolo ? testoRicco(ctx, b.titolo, ix, 0, iw, 21, ink.fg, true, false, false, 1.35) + 6 : 0;
      const hTxt = T ? testoRicco(ctx, T, ix, 0, iw, 21, ink.fg, false, false, false, 1.48) : 0;
      const hh = pad * 2 + hTit + hTxt;
      if (disegna){
        ctx.save();
        ctx.fillStyle = ink.box;
        arrotondaRett(ctx, x, y, larg, hh, 10); ctx.fill();
        ctx.fillStyle = '#4c5fd7';
        arrotondaRett(ctx, x, y, 4, hh, 2); ctx.fill();
        ctx.restore();
        let yy = y + pad;
        if (b.titolo) yy += testoRicco(ctx, b.titolo, ix, yy, iw, 21, evid ? '#4c5fd7' : ink.fg, true, false, true, 1.35) + 6;
        if (T) testoRicco(ctx, T, ix, yy, iw, 21, ink.fg, false, false, true, 1.48);
      }
      return hh + 16;
    }
    case 'formula': {
      const h2 = 46;
      if (disegna){
        ctx.save();
        ctx.fillStyle = ink.box;
        arrotondaRett(ctx, x, y, larg, h2, 8); ctx.fill();
        ctx.font = '600 24px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
        ctx.fillStyle = ink.fg;
        ctx.textAlign = 'center';
        ctx.fillText(T, x + larg / 2, y + 12);
        ctx.textAlign = 'left';
        ctx.restore();
      }
      return h2 + 16;
    }
    case 'domanda': {
      let hh = testoRicco(ctx, T, x + 34, y, larg - 34, 23, ink.fg, true, false, disegna, 1.45);
      if (disegna){
        ctx.font = fontPer(23, true); ctx.fillStyle = '#4c5fd7';
        ctx.fillText('?', x + 8, y);
      }
      if (b.risposta && P.mostraRisposte !== false){
        const hr = testoRicco(ctx, b.risposta, x + 34, y + hh + 8, larg - 34, 21, ink.fg2, false, false, false, 1.45);
        if (disegna){
          ctx.save(); ctx.globalAlpha = .55;
          ctx.fillStyle = ink.box; arrotondaRett(ctx, x + 26, y + hh + 2, larg - 26, hr + 12, 8); ctx.fill();
          ctx.restore();
          testoRicco(ctx, b.risposta, x + 34, y + hh + 8, larg - 34, 21, ink.fg2, false, false, true, 1.45);
        }
        hh += hr + 16;
      } else if (b.risposta){
        if (disegna){
          ctx.save(); ctx.strokeStyle = ink.linea; ctx.setLineDash([5, 5]);
          ctx.strokeRect(x + 26, y + hh + 6, larg - 26, 54); ctx.restore();
        }
        hh += 62;
      }
      return hh + 14;
    }
    case 'tabella': {
      const righe = b.righe || [];
      if (!righe.length) return 0;
      const nCol = Math.max.apply(null, righe.map(r => r.length));
      const wCol = larg / nCol, hRiga = 38;
      if (disegna){
        ctx.save();
        ctx.strokeStyle = ink.linea; ctx.lineWidth = 1;
        righe.forEach((r, i) => {
          if (i === 0){ ctx.fillStyle = ink.box; ctx.fillRect(x, y, larg, hRiga); }
          ctx.strokeRect(x, y + i * hRiga, larg, hRiga);
          r.forEach((c, j) => {
            ctx.font = fontPer(18, i === 0);
            ctx.fillStyle = ink.fg;
            ctx.save(); ctx.beginPath(); ctx.rect(x + j * wCol, y + i * hRiga, wCol, hRiga); ctx.clip();
            ctx.fillText(String(c), x + j * wCol + 9, y + i * hRiga + 10);
            ctx.restore();
            if (j) { ctx.beginPath(); ctx.moveTo(x + j * wCol, y + i * hRiga); ctx.lineTo(x + j * wCol, y + (i + 1) * hRiga); ctx.stroke(); }
          });
        });
        ctx.restore();
      }
      return righe.length * hRiga + 18;
    }
    case 'separatore':
      if (disegna){ ctx.save(); ctx.strokeStyle = ink.linea; ctx.beginPath(); ctx.moveTo(x, y + 10); ctx.lineTo(x + larg, y + 10); ctx.stroke(); ctx.restore(); }
      return 26;
  }
  return testoRicco(ctx, T, x, y, larg, 23, ink.fg, false, false, disegna, 1.5) + 12;
}
function arrotondaRett(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function disegnaBlocchi(ctx, P){
  let y = MRG.alto;
  for (const b of P.blocchi) y += blocco(ctx, b, y, P, true);
}
/* spezza l'elenco dei blocchi su più pagine */
function impagina(blocchi, P){
  const ctx = ctxMisura;
  const utile = P.h - MRG.alto - MRG.basso;
  const pagine = []; let corrente = []; let y = 0;
  const coda = blocchi.slice();
  let sicurezza = 0;
  while (coda.length && sicurezza++ < 4000){
    const b = coda.shift();
    const h = blocco(ctx, b, MRG.alto, P, false);
    if (h <= utile - y){ corrente.push(b); y += h; continue; }
    // non ci sta: provo a spezzarlo
    const sp = spezzaBlocco(ctx, b, P, utile - y);
    if (sp){ corrente.push(sp[0]); coda.unshift(sp[1]); }
    else if (!corrente.length){ corrente.push(b); }   // blocco enorme: lo lascio comunque
    else coda.unshift(b);
    pagine.push(corrente); corrente = []; y = 0;
  }
  if (corrente.length) pagine.push(corrente);
  return pagine.length ? pagine : [[]];
}
function spezzaBlocco(ctx, b, P, spazio){
  if (spazio < 90) return null;
  if (b.tipo === 'elenco' || b.tipo === 'elenco_numerato'){
    const voci = b.voci || [];
    if (voci.length < 2) return null;
    for (let k = voci.length - 1; k >= 1; k--){
      const test = Object.assign({}, b, { voci: voci.slice(0, k) });
      if (blocco(ctx, test, MRG.alto, P, false) <= spazio)
        return [test, Object.assign({}, b, { voci: voci.slice(k) })];
    }
    return null;
  }
  if (b.tipo === 'paragrafo'){
    const parole = (b.testo || '').split(' ');
    if (parole.length < 12) return null;
    for (let k = parole.length - 4; k >= 8; k -= 4){
      const test = Object.assign({}, b, { testo: parole.slice(0, k).join(' ') });
      if (blocco(ctx, test, MRG.alto, P, false) <= spazio)
        return [test, Object.assign({}, b, { testo: parole.slice(k).join(' ') })];
    }
  }
  return null;
}

/* generatore PDF minimale: una immagine JPEG per pagina */
function costruisciPDF(immagini, W, H){
  const parti = [];
  const enc = new TextEncoder();
  let lung = 0;
  const off = [];
  const put = s => { const b = (typeof s === 'string') ? enc.encode(s) : s; parti.push(b); lung += b.length; };
  const oggetto = (n, corpo, flusso) => {
    off[n] = lung;
    put(n + ' 0 obj\n' + corpo + '\n');
    if (flusso){ put('stream\n'); put(flusso); put('\nendstream\n'); }
    put('endobj\n');
  };
  const n = immagini.length;
  put('%PDF-1.4\n%âãÏÓ\n');
  const idsPagine = immagini.map((_, i) => 3 + i * 3);
  oggetto(1, '<< /Type /Catalog /Pages 2 0 R >>');
  oggetto(2, '<< /Type /Pages /Kids [' + idsPagine.map(i => i + ' 0 R').join(' ') + '] /Count ' + n + ' >>');
  immagini.forEach((im, i) => {
    const pg = 3 + i * 3, cont = pg + 1, img = pg + 2;
    oggetto(pg, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W.toFixed(2) + ' ' + H.toFixed(2) + ']' +
      ' /Resources << /XObject << /I0 ' + img + ' 0 R >> >> /Contents ' + cont + ' 0 R >>');
    const flusso = 'q ' + W.toFixed(2) + ' 0 0 ' + H.toFixed(2) + ' 0 0 cm /I0 Do Q';
    oggetto(cont, '<< /Length ' + flusso.length + ' >>', enc.encode(flusso));
    oggetto(img, '<< /Type /XObject /Subtype /Image /Width ' + im.w + ' /Height ' + im.h +
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + im.bytes.length + ' >>', im.bytes);
  });
  const inizioXref = lung;
  const totale = 3 + n * 3;
  let xref = 'xref\n0 ' + totale + '\n0000000000 65535 f \n';
  for (let i = 1; i < totale; i++) xref += String(off[i] || 0).padStart(10, '0') + ' 00000 n \n';
  put(xref);
  put('trailer\n<< /Size ' + totale + ' /Root 1 0 R >>\nstartxref\n' + inizioXref + '\n%%EOF\n');
  const out = new Uint8Array(lung);
  let p = 0;
  for (const b of parti){ out.set(b, p); p += b.length; }
  return out;
}

let pdfjsPronto = null;
function caricaPdfJs(){
  if (pdfjsPronto) return pdfjsPronto;
  pdfjsPronto = new Promise((ris, rif) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      if (!window.pdfjsLib) return rif(new Error('libreria non disponibile'));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      ris(window.pdfjsLib);
    };
    s.onerror = () => rif(new Error('serve una connessione a internet'));
    document.head.appendChild(s);
  });
  return pdfjsPronto;
}
$('#file-pdf').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    progresso(0.05);
    const pdfjs = await caricaPdfJs();
    const buf = await f.arrayBuffer();
    const doc = await pdfjs.getDocument({ data: buf }).promise;
    const N = Math.min(doc.numPages, 60);
    let dopo = stato.iPagina;
    for (let i = 1; i <= N; i++){
      const p = await doc.getPage(i);
      const vp0 = p.getViewport({ scale: 1 });
      const scala = 1500 / Math.max(vp0.width, vp0.height);
      const vp = p.getViewport({ scale: scala });
      const c = document.createElement('canvas');
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      await p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
      const asset = await salvaAsset(blob);
      const orizz = vp.width > vp.height;
      const nuova = nuovaPagina(stato.quaderno.id, {
        ordine: dopo + i,
        modello: 'bianco', carta: 'bianco',
        w: orizz ? PAG_H : PAG_W, h: orizz ? PAG_W : PAG_H
      });
      nuova.sfondo = asset;
      stato.pagine.splice(dopo + i, 0, nuova);
      daSalvare.set(nuova.id, nuova);
      progresso(0.05 + 0.9 * i / N);
    }
    stato.pagine.forEach((p, i) => { p.ordine = i; daSalvare.set(p.id, p); });
    await salvaSubito();
    progresso(null);
    await vaiAPagina(dopo + 1);
    toast(N + (N === 1 ? ' pagina importata' : ' pagine importate'), 'ok');
    if (doc.numPages > N) toast('Importate solo le prime ' + N + ' pagine');
  } catch(err){
    progresso(null);
    toast('PDF non importato: ' + err.message, 'err');
  }
});

async function chiamataIA(corpo){
  const c = stato.config;
  let resp;
  if (c.iaModo === 'diretto'){
    if (!c.iaChiave) throw new Error('Manca la chiave API nelle impostazioni');
    resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': c.iaChiave,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify(corpo)
    });
  } else {
    if (!c.iaBackendUrl) throw new Error('Manca l’indirizzo del server nelle impostazioni');
    const h = { 'content-type':'application/json' };
    if (c.iaBackendSegreto) h['x-app-secret'] = c.iaBackendSegreto;
    resp = await fetch(c.iaBackendUrl.replace(/\/$/, '') + '/api/ia', { method:'POST', headers:h, body: JSON.stringify(corpo) });
  }
  let dati;
  try { dati = await resp.json(); }
  catch(e){ throw new Error('risposta non leggibile dal server (' + resp.status + ')'); }
  if (!resp.ok){
    const m = (dati && (dati.error && (dati.error.message || dati.error) || dati.messaggio)) || ('errore ' + resp.status);
    throw new Error(String(m));
  }
  return dati;
}
function testoDaRisposta(dati){
  if (dati && typeof dati === 'object' && Array.isArray(dati.content)){
    if (dati.stop_reason === 'refusal') throw new Error('la richiesta è stata rifiutata dal modello');
    const b = dati.content.find(x => x.type === 'text');
    if (!b) throw new Error('risposta vuota');
    return b.text;
  }
  if (dati && dati.blocchi) return JSON.stringify(dati);   // backend che risponde già in chiaro
  throw new Error('formato della risposta non riconosciuto');
}

    '- Usa "sottotitolo" per dividere le sezioni, "paragrafo" per le spiegazioni, "elenco"/"elenco_numerato" per i punti, ' +
    '"definizione" (con "titolo" = il termine) per i termini da sapere, "evidenzia" per le cose da non dimenticare, ' +
    '"formula" per formule e regole, "domanda" (con "risposta") per esercizi e quiz, "tabella" per i confronti, "citazione" per le citazioni.\n' +
    '- Nei campi che non servono metti stringa vuota o lista vuota.\n' +
    '- Dentro "testo" puoi usare **grassetto** per le parole chiave. Nessun altro simbolo di formattazione, nessun markdown, nessun LaTeX: ' +
    'scrivi le formule in modo leggibile (per esempio "x = (-b ± √(b²-4ac)) / 2a").\n' +
    '- Frasi brevi e concrete. Niente introduzioni del tipo "certo, ecco...". Niente riferimenti a te stesso.\n\n' +
    'CONTESTO\n' +
    '- Materia del quaderno: ' + materia + '\n' +
    '- Livello scolastico: ' + (livelli[c.livello] || livelli.superiori) + '. Adatta linguaggio, profondità ed esempi a questo livello.\n' +
    '- Lingua della pagina: ' + (c.lingua || 'italiano') + '.\n' +
    '- Se qualcosa non è certo, dillo esplicitamente invece di inventarlo: sono appunti su cui si studierà davvero.\n\n' +
    'COMPITO\n' + modo.istr + '\n' + (lunghezze[opz.lunghezza] || lunghezze.media);

  const contenuto = [];
  if (opz.conPagina){
    const b64 = await immaginePaginaBase64(pag());
    contenuto.push({ type:'image', source:{ type:'base64', media_type:'image/jpeg', data:b64 } });
    contenuto.push({ type:'text', text:'Questa immagine è la pagina del quaderno su cui sto lavorando (può contenere testo scritto a mano, esercizi o uno schema). Tienine conto.' });
  }
  contenuto.push({ type:'text', text: opz.richiesta });

  const dati = await chiamataIA({
    model: c.iaModello || 'claude-opus-5',
    max_tokens: 16000,
    system: sistema,
    messages: [{ role:'user', content: contenuto }],
    output_config: { format: { type:'json_schema', schema: SCHEMA_PAGINA } }
  });

  const testo = testoDaRisposta(dati);
  let out;
  try { out = JSON.parse(testo); }
  catch(e){
    const m = testo.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('la risposta non era in formato leggibile');
    out = JSON.parse(m[0]);
  }
  if (!out.blocchi || !out.blocchi.length) throw new Error('la risposta non conteneva contenuti');
  return out;
}

/* trasforma la risposta del modello in una o più pagine nuove dopo quella corrente */
async function inserisciRisultatoIA(out){
  const base = pag();
  const blocchi = out.blocchi.slice();
  if (out.titolo && (!blocchi[0] || blocchi[0].tipo !== 'titolo'))
    blocchi.unshift({ tipo:'titolo', testo: out.titolo, titolo:'', voci:[], risposta:'', righe:[] });

  const fogli = impagina(blocchi, { w:base.w, h:base.h, carta:base.carta, mostraRisposte:true });
  let indice = stato.iPagina;
  for (const foglio of fogli){
    const P = nuovaPagina(stato.quaderno.id, {
      ordine: indice + 1, modello:'bianco', carta: base.carta, w: base.w, h: base.h
    });
    P.blocchi = foglio;
    P.titoloBlocchi = out.titolo || '';
    stato.pagine.splice(++indice, 0, P);
  }
  stato.pagine.forEach((p, i) => { p.ordine = i; daSalvare.set(p.id, p); });
  await salvaSubito();
  await vaiAPagina(stato.iPagina + 1);
  return fogli.length;
}

function riempiModelli(cont, attivo, carta, suScelta){
  cont.innerHTML = MODELLI.map(m =>
    '<button class="modello' + (m === attivo ? ' attivo' : '') + '" data-mod="' + m + '"><span class="prev"></span>' + esc(NOMI_MODELLI[m]) + '</button>').join('');
  $$('.modello', cont).forEach(b => {
    const c = document.createElement('canvas');
    const finto = { w:PAG_W, h:PAG_H, modello:b.dataset.mod, carta };
    const s = 120 / PAG_W;
    c.width = Math.round(PAG_W * s * 2); c.height = Math.round(PAG_H * s * 2);
    const ctx = c.getContext('2d'); ctx.scale(s * 2, s * 2);
    disegnaCarta(ctx, finto);
    b.querySelector('.prev').appendChild(c);
    b.onclick = () => {
      $$('.modello', cont).forEach(x => x.classList.toggle('attivo', x === b));
      suScelta(b.dataset.mod);
    };
  });
}

async function spazioUsato(){
  const q = (await archivio.tutti('quaderni')).length;
  const p = (await archivio.tutti('pagine')).length;
  let testo = q + (q === 1 ? ' quaderno' : ' quaderni') + ', ' + p + (p === 1 ? ' pagina' : ' pagine') + '.';
  if (navigator.storage && navigator.storage.estimate){
    try {
      const s = await navigator.storage.estimate();
      if (s.usage) testo += ' Occupano circa ' + (s.usage / 1048576).toFixed(1) + ' MB sul dispositivo.';
    } catch(e){}
  }
  return testo + ' I dati restano su questo dispositivo: se svuoti i dati del browser vengono persi, quindi ogni tanto salva una copia.';
}
function blobInBase64(blob){
  return new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result.split(',')[1]); f.readAsDataURL(blob); });
}
function base64InBlob(b64, tipo){
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: tipo || 'image/jpeg' });
}
async function esportaBackup(){
  try {
    progresso(0.2);
    const quaderni = await archivio.tutti('quaderni');
    const pagine = await archivio.tutti('pagine');
    const asset = await archivio.tutti('asset');
    progresso(0.6);
    const fuori = { versione:1, data:Date.now(), quaderni, pagine, asset:[] };
    for (const a of asset) fuori.asset.push({ id:a.id, tipo:a.blob.type, dati: await blobInBase64(a.blob) });
    progresso(null);
    scarica(new Blob([JSON.stringify(fuori)], { type:'application/json' }),
      'quaderno-backup-' + new Date().toISOString().slice(0, 10) + '.json');
    toast('Copia salvata', 'ok');
  } catch(e){ progresso(null); toast('Copia non riuscita: ' + e.message, 'err'); }
}
function importaBackup(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      progresso(0.2);
      const dati = JSON.parse(await f.text());
      if (!dati.quaderni || !dati.pagine) throw new Error('file non valido');
      const mappa = new Map();
      for (const q of dati.quaderni){
        const nuovo = uid('q_'); mappa.set(q.id, nuovo);
        await archivio.salva('quaderni', Object.assign({}, q, { id:nuovo }));
      }
      for (const a of (dati.asset || [])) await archivio.salva('asset', { id:a.id, blob: base64InBlob(a.dati, a.tipo) });
      for (const p of dati.pagine){
        const qid = mappa.get(p.quadernoId); if (!qid) continue;
        await archivio.salva('pagine', Object.assign({}, p, { id:uid('p_'), quadernoId:qid }));
      }
      progresso(null);
      await caricaLibreria();
      toast(dati.quaderni.length + ' quaderni ripristinati', 'ok');
    } catch(e){ progresso(null); toast('Ripristino non riuscito: ' + e.message, 'err'); }
  };
  inp.click();
}

function collegaUI(){
  $('#b-nuovo').onclick = () => modaleNuovoQuaderno();
  $('#b-impostazioni').onclick = () => modaleImpostazioni();
  $('#b-tema').onclick = () => {
    const ordine = ['auto','chiaro','scuro'];
    stato.config.tema = ordine[(ordine.indexOf(stato.config.tema) + 1) % 3];
    applicaTema(); salvaConfig();
    toast('Tema: ' + { auto:'come il sistema', chiaro:'chiaro', scuro:'scuro' }[stato.config.tema]);
  };
  $('#cerca').oninput = debounce(e => { stato.ricerca = e.target.value; disegnaLibreria(); }, 150);
  $('#chips-materie').onclick = e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    stato.filtroMateria = b.dataset.m; disegnaLibreria();
  };

  $('#b-chiudi-doc').onclick = () => chiudiQuaderno();
  $('#b-menu-doc').onclick = () => menuDocumento();
  $('#b-ia').onclick = () => modaleIA();
  $('#b-annulla').onclick = $('#b-annulla2').onclick = () => annulla();
  $('#b-ripeti').onclick = $('#b-ripeti2').onclick = () => ripeti();
  $('#b-pagine').onclick = () => {
    const d = $('#pagine-drawer');
    d.classList.toggle('aperto');
    $('#b-pagine').classList.toggle('attivo', d.classList.contains('aperto'));
    if (d.classList.contains('aperto')) disegnaMiniature();
  };
  $('#titolo-doc').onchange = () => {
    if (!stato.quaderno) return;
    stato.quaderno.nome = $('#titolo-doc').value.trim() || 'Senza titolo';
    $('#titolo-doc').value = stato.quaderno.nome;
    archivio.salva('quaderni', stato.quaderno);
  };
  $('#dock').addEventListener('click', e => {
    const b = e.target.closest('.strumento[data-str]');
    if (b) impostaStrumento(b.dataset.str);
  });
  $('#b-zoom-piu').onclick = () => impostaZoom(stato.vista.zoom * 1.25);
  $('#b-zoom-meno').onclick = () => impostaZoom(stato.vista.zoom / 1.25);
  $('#b-zoom-fit').onclick = () => adattaZoom();

  area.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('resize', debounce(() => { if (stato.quaderno) dimensionaTele(); }, 120));
  window.addEventListener('orientationchange', () => setTimeout(() => { if (stato.quaderno) dimensionaTele(); }, 300));
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/q=([\w_]+)/);
    if (!m && stato.quaderno) chiudiQuaderno();
  });
  window.addEventListener('beforeunload', e => { if (daSalvare.size) salvaSubito(); });
}

(async function avvio(){
  try {
    await caricaConfig();
    const c = stato.config;
    if (c.penna) Object.assign(stato.penna, c.penna);
    if (c.evidenziatore) Object.assign(stato.evidenziatore, c.evidenziatore);
    if (c.gomma) Object.assign(stato.gomma, c.gomma);
    if (c.testoStile) Object.assign(stato.testo, c.testoStile);
    if (c.forma) stato.forma = c.forma;
    aggiornaPunte();
    collegaUI();
    await caricaLibreria();
    const m = location.hash.match(/q=([\w_]+)/);
    if (m) await apriQuaderno(m[1]);
  } catch(e){
    console.error(e);
    toast('Avvio non riuscito: ' + e.message, 'err');
  }
})();
