<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #root { min-height: 100vh; }

  .ts-switcher { position: sticky; top: 0; z-index: 40; display: none; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; background: rgba(10,9,8,0.98); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
  .ts-switcher.ts-visible { display: flex; }
  .ts-switch-btn { flex: 1; max-width: 220px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; letter-spacing: .3px; cursor: pointer; text-align: center; }
  .ts-switch-btn.ts-active { border-color: var(--brass); color: var(--brass); background: var(--surface-2); }
  #porte-section { display: block; }
  #questura-section { display: none; min-height: 100vh; background: var(--bg); }

  #app * { box-sizing: border-box; }

<script>
(function(){
  var PREFIX = 'torino-suite:';
  var LOCAL_ONLY = ['as-backend'];
  function localGet(key){
    try { var v = window.localStorage.getItem(PREFIX+key); return v===null?null:{key:key,value:v,shared:false}; } catch(e){ return null; }
  }
  function localSet(key,value){
    try { window.localStorage.setItem(PREFIX+key, value); return {key:key,value:value,shared:false}; } catch(e){ return null; }
  }
  function localDelete(key){
    try { var existed = window.localStorage.getItem(PREFIX+key)!==null; window.localStorage.removeItem(PREFIX+key); return {key:key,deleted:existed,shared:false}; } catch(e){ return null; }
  }
  function localList(prefix){
    try {
      var keys=[];
      for (var i=0;i<window.localStorage.length;i++){
        var k = window.localStorage.key(i);
        if (k && k.indexOf(PREFIX)===0){
          var kk = k.slice(PREFIX.length);
          if (!prefix || kk.indexOf(prefix)===0) keys.push(kk);
        }
      }
      return { keys: keys, prefix: prefix||'', shared:false };
    } catch(e){ return null; }
  }
  function backendCfg(){
    var raw = localGet('as-backend');
    if (!raw || !raw.value) return null;
    try { var c = JSON.parse(raw.value); return (c && c.url) ? c : null; } catch(e){ return null; }
  }
  window.storage = {
    async get(key, shared){
      if (LOCAL_ONLY.indexOf(key) === -1){
        var cfg = backendCfg();
        if (cfg){
          try {
            var r = await fetch(cfg.url.replace(/\/$/,'')+'/api/store?key='+encodeURIComponent(key), {
              headers: cfg.secret ? {'x-app-secret': cfg.secret} : {}
            });
            if (r.ok){
              var d = await r.json();
              if (d && d.value != null) return { key:key, value:d.value, shared: !!shared };
              var loc = localGet(key);
              if (loc && loc.value){
                try {
                  await fetch(cfg.url.replace(/\/$/,'')+'/api/store', {
                    method:'POST',
                    headers: Object.assign({'Content-Type':'application/json'}, cfg.secret?{'x-app-secret':cfg.secret}:{}),
                    body: JSON.stringify({key:key, value:loc.value})
                  });
                } catch(e){}
                return loc;
              }
            }
          } catch(e){}
        }
      }
      return localGet(key);
    },
    async set(key, value, shared){
      if (LOCAL_ONLY.indexOf(key) === -1){
        var cfg = backendCfg();
        if (cfg){
          try {
            var r = await fetch(cfg.url.replace(/\/$/,'')+'/api/store', {
              method:'POST',
              headers: Object.assign({'Content-Type':'application/json'}, cfg.secret?{'x-app-secret':cfg.secret}:{}),
              body: JSON.stringify({key:key, value:value})
            });
            if (r.ok) return { key:key, value:value, shared: !!shared };
          } catch(e){}
        }
      }
      return localSet(key, value);
    },
    async delete(key, shared){
      if (LOCAL_ONLY.indexOf(key) === -1){
        var cfg = backendCfg();
        if (cfg){
          try {
            var r = await fetch(cfg.url.replace(/\/$/,'')+'/api/store?key='+encodeURIComponent(key), {
              method:'DELETE',
              headers: cfg.secret?{'x-app-secret':cfg.secret}:{}
            });
            if (r.ok) return { key:key, deleted:true, shared: !!shared };
          } catch(e){}
        }
      }
      return localDelete(key);
    },
    async list(prefix, shared){
      return localList(prefix);
    }
  };
})();
</script>

${Wp}

:root {
  --bg: #0a0a0a;
  --surface: #141210;
  --surface-2: #1c1915;
  --border: #2a2620;
  --brass: #c9a24a;
  --brass-dim: #8a713a;
  --steel: #a8956a;
  --text: #f2ede3;
  --text-muted: #9c9686;
  --danger: #b25a45;
  --ok: #8aae6f;
}

.app-root {
  min-height: 100vh;
  background: radial-gradient(1200px 600px at 50% -10%, #171410 0%, var(--bg) 60%);
  font-family: 'Inter', sans-serif;
  color: var(--text);
}

* { box-sizing: border-box; }

.screen { min-height: 100vh; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(20px + env(safe-area-inset-top)) 20px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(18,20,26,0.9);
  backdrop-filter: blur(6px);
  z-index: 5;
}
.topbar-home { align-items: center; }

.title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: 23px;
  letter-spacing: 0.5px;
}

.back {
  display: flex;
  align-items: center;
  gap: 2px;
  background: none;
  border: none;
  color: var(--steel);
  font-size: 18px;
  cursor: pointer;
  width: 76px;
}
.back:focus-visible { outline: 2px solid var(--steel); border-radius: 6px; }

.brand-eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--brass);
}
.brand-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: 34px;
  letter-spacing: 0.5px;
  margin-top: 2px;
}

.add-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.add-btn:hover { border-color: var(--brass-dim); }
.add-btn:focus-visible { outline: 2px solid var(--brass); }

.content {
  padding: 18px 20px 60px;
  max-width: 620px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

.grid {
  padding: 20px;
  max-width: 640px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 14px;
}

/* --- keytag: elemento firma, targhetta fisica --- */
.keytag {
  position: relative;
  display: flex;
  gap: 12px;
  background: linear-gradient(155deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border);
  border-left: 3px solid var(--brass);
  border-radius: 10px;
  padding: 16px 16px 16px 22px;
  text-align: left;
  cursor: pointer;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  transition: transform 0.12s ease, border-color 0.12s ease;
}
.keytag:hover { transform: translateY(-1px); border-color: var(--brass-dim); }
.keytag:focus-visible { outline: 2px solid var(--brass); }

.keytag-hole {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--border);
}

.keytag-body { flex: 1; min-width: 0; }

.keytag-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.led {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13.5px;
  letter-spacing: 0.5px;
}
.led-on { color: var(--ok); }
.led-off { color: var(--text-muted); }

.keytag-name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: 23px;
  letter-spacing: 0.3px;
}

.keytag-meta {
  margin-top: 6px;
  font-size: 15px;
  color: var(--text-muted);
  display: flex;
  gap: 6px;
}
.meta-warn { color: var(--danger); }
.dot { opacity: 0.5; }

/* --- righe menu funzioni --- */
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 18px 16px;
  border-radius: 10px;
  margin-bottom: 6px;
  cursor: pointer;
  font-size: 18px;
  font-family: 'Inter', sans-serif;
  text-align: left;
}
.row:hover { background: var(--surface-2); }
.row:focus-visible { outline: 2px solid var(--steel); }
.row-label { flex: 1; }
.row-chevron { color: var(--text-muted); font-size: 21px; }
.row-danger { color: var(--danger); }
.row-danger svg { color: var(--danger); }

.section-gap { height: 14px; }

.pill {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  padding: 3px 8px;
  border-radius: 20px;
  letter-spacing: 0.5px;
  margin-right: 4px;
}
.pill-on { background: rgba(111,174,140,0.15); color: var(--ok); }
.pill-off { background: rgba(139,144,156,0.15); color: var(--text-muted); }

.field-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14.5px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.tier-list { display: flex; flex-direction: column; gap: 6px; }
.tier {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
  padding: 12px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 17px;
}
.tier-active {
  border-color: var(--brass);
  color: var(--text);
  background: rgba(201,162,74,0.08);
}
.tier:focus-visible { outline: 2px solid var(--steel); }

.log { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--border); }
.log-row {
  display: flex;
  gap: 14px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 17px;
}
.log-time {
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text-muted);
  font-size: 15.5px;
  white-space: nowrap;
  padding-top: 1px;
}

.empty, .empty-inline { color: var(--text-muted); font-size: 17px; }

.textarea, .input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 12px 14px;
  font-family: 'Inter', sans-serif;
  font-size: 17px;
  resize: vertical;
}
.textarea:focus, .input:focus { outline: 2px solid var(--steel); border-color: transparent; }

select.input {
  appearance: none;
  -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 13px) calc(50% - 3px);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  cursor: pointer;
}

.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--brass);
  color: #1a1508;
  border: none;
  border-radius: 8px;
  padding: 14px 16px;
  font-weight: 600;
  font-size: 17px;
  cursor: pointer;
  margin-top: 10px;
  font-family: 'Inter', sans-serif;
}
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-call {
  margin-top: 28px;
  padding: 20px 16px;
  font-size: 19px;
  text-decoration: none;
}
.btn-primary:focus-visible { outline: 2px solid var(--text); }

.header-right { display: flex; align-items: center; }

.segmented {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
}
.segmented button {
  background: none;
  border: none;
  color: var(--text-muted);
  padding: 7px 14px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
}
.segmented button.active {
  background: var(--brass);
  color: #1a1508;
  font-weight: 600;
}

.bacheca-preview {
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  background: linear-gradient(155deg, var(--surface-2) 0%, var(--surface) 100%);
  border: 1px solid var(--border);
  border-left: 3px solid var(--brass);
  border-radius: 12px;
  font-size: 18px;
  color: var(--text);
}

.code-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  cursor: pointer;
  color: var(--steel);
}
.code-chip-group {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-right: 8px;
}
.code-chip:hover { border-color: var(--steel); }
.sms-link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 6px;
  background: rgba(91,122,153,0.15);
  color: var(--steel);
  text-decoration: none;
}
.sms-link:hover { background: rgba(91,122,153,0.28); }
.code-text {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 15px;
  letter-spacing: 0.5px;
  color: var(--text);
}

.prefix-list { display: flex; flex-direction: column; gap: 8px; }
.prefix-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.prefix-label { font-size: 17px; color: var(--text); flex: 1; }
.prefix-input {
  width: 90px;
  font-family: 'IBM Plex Mono', monospace;
  text-align: center;
  text-transform: uppercase;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;

function compressImage(file, maxWidth, quality){
  return new Promise(function(resolve, reject){
    var img = new Image();
    var reader = new FileReader();
    reader.onload = function(){
      img.onload = function(){
        var scale = Math.min(1, maxWidth / img.width);
        var w = Math.round(img.width * scale);
        var h = Math.round(img.height * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
      };
      img.onerror = function(){ reject(new Error('immagine non leggibile')); };
      img.src = reader.result;
    };
    reader.onerror = function(){ reject(new Error('lettura file fallita')); };
    reader.readAsDataURL(file);
  });
}

async function archiveDocument(file, guest){
  try {

    var b64 = isPdf ? await fileToBase64(file) : await compressImage(file, 1100, 0.72);
    if (!isPdf && b64.length > 4.5 * 1024 * 1024) { b64 = await compressImage(file, 700, 0.6); }
    var isDependent = guest.ruolo === 'familiare' || guest.ruolo === 'membro';
    var head = isDependent ? state.guests.find(function(x){ return x.id === guest.groupOf; }) : guest;
    var entry = {
      id: uid(),
      fotoKey: 'as-doc-' + Math.random().toString(36).slice(2,10),
      isPdf: isPdf,
      dataCaricamento: new Date().toISOString(),

      cognomeOspite: guest.cognome || '',

      guestId: guest.id
    };
    await remoteStorage.set(entry.fotoKey, b64);
    state.archivio.push(entry);
    await saveArchivio();
  } catch(e){
    console.error('archiviazione fallita', e);
  }
}

function backendUrl(path){

function backendHeaders(extra){
  var h = Object.assign({}, extra || {});
  if (state.backend.secret) h['x-app-secret'] = state.backend.secret;
  return h;
}

var remoteStorage = {
  async get(key){
    if (!state.backend.url) return null;
    try {
      var r = await fetch(backendUrl('/api/store?key='+encodeURIComponent(key)), { headers: backendHeaders() });
      if (!r.ok) return null;
      var d = await r.json();
      return (d && d.value != null) ? { key: key, value: d.value } : null;
    } catch(e){ return null; }
  },
  async set(key, value){
    if (!state.backend.url) return null;
    try {
      var r = await fetch(backendUrl('/api/store'), {
        method: 'POST',
        headers: backendHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ key: key, value: value })
      });
      return r.ok ? { key: key, value: value } : null;
    } catch(e){ return null; }
  },
  async delete(key){
    if (!state.backend.url) return null;
    try {
      var r = await fetch(backendUrl('/api/store?key='+encodeURIComponent(key)), { method: 'DELETE', headers: backendHeaders() });
      return r.ok ? { key: key, deleted: true } : null;
    } catch(e){ return null; }
  }
};

function parseCsv(text, kind){
  var lines = text.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  var out = [];
  lines.forEach(function(line){
    var sep = line.indexOf(';') !== -1 ? ';' : ',';
    var parts = line.split(sep).map(function(p){return p.trim();});
    if (kind === 'comuni'){
      if (parts.length < 3) return;
      out.push({ codice: parts[0], nome: parts[1], provincia: parts[2] });
    } else {
      if (parts.length < 2) return;
      out.push({ codice: parts[0], nome: parts[1] });
    }
  });
  return out;
}

function tokenSet(s){
  return (s||'').toUpperCase().split(/[^A-Z0-9]+/).filter(function(w){ return w.length >= 3; }).sort().join('|');
}
function normName(s){
  return (s||'').toUpperCase().replace(/[^A-Z0-9]/g, '');
}
function findByName(list, name){
  if (!name) return null;
  var n = name.trim().toLowerCase();
  var exact = list.find(function(x){ return x.nome.toLowerCase() === n; });
  if (exact) return exact;
  var nn = normName(name);
  var normMatch = list.find(function(x){ return normName(x.nome) === nn; });
  if (normMatch) return normMatch;
  var contains = list.find(function(x){
    var xn = normName(x.nome);
    return xn.indexOf(nn) !== -1 || nn.indexOf(xn) !== -1;
  });
  if (contains) return contains;
  var tok = tokenSet(name);
  var tokMatch = list.find(function(x){ return tokenSet(x.nome) === tok; });
  if (tokMatch) return tokMatch;
  return list.find(function(x){ return x.nome.toLowerCase().indexOf(n) === 0; }) || null;
}

/* ---------- OCR ---------- */
function fileToBase64(file){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ res(r.result.split(',')[1]); };
    r.onerror = function(){ rej(new Error('read failed')); };
    r.readAsDataURL(file);
  });
}

async function ocrDocument(file, guest){
  guest.ocrPending = true; render();
  try {
    if (!state.backend.url) throw new Error("Configura prima l'indirizzo del backend nella scheda \"Backend\" (serve per leggere i documenti)");
    var b64 = await fileToBase64(file);
    var mediaType = file.type || 'image/jpeg';
    var resp = await fetch(backendUrl('/api/ocr'), {
      method: "POST",
      headers: backendHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ imageBase64: b64, mediaType: mediaType })
    });
    var parsed = await resp.json();
    if (!resp.ok) throw new Error(parsed.error || 'estrazione fallita sul backend');
    guest.cognome = (parsed.cognome || '').toUpperCase();
    guest.nome = (parsed.nome || '').toUpperCase();
    guest.sesso = parsed.sesso === 'F' ? 'F' : 'M';
    guest.dataNascita = parsed.data_nascita || '';
    guest.nascitaEstero = !!parsed.nascita_estero;
    if (guest.nascitaEstero) guest.statoNascitaNome = (parsed.luogo_nascita || '').toUpperCase();
    else guest.comuneNascitaNome = (parsed.luogo_nascita || '').toUpperCase();
    guest.cittadinanzaNome = (parsed.cittadinanza || 'ITALIA').toUpperCase();
    guest.tipoDocumentoNome = (parsed.tipo_documento || '').toUpperCase();
    guest.numeroDocumento = (parsed.numero_documento || '').toUpperCase();
    guest.rilascioEstero = !!parsed.rilascio_estero;
    guest.luogoRilascioNome = (parsed.luogo_rilascio || '').toUpperCase();
  } catch(e){
    alert('Estrazione non riuscita, inserisci i dati manualmente. (' + e.message + ')');
  }
  guest.ocrPending = false;
  saveGuests(); render();
}

function attachGuestHandlers(root){
  root.querySelectorAll('[data-remove]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-remove');
      state.guests = state.guests.filter(function(g){ return g.id !== id; });
      saveGuests(); render();
    };
  });
  root.querySelectorAll('[data-f]').forEach(function(inp){
    inp.onchange = function(){
      var id = inp.getAttribute('data-id');
      var f = inp.getAttribute('data-f');
      var g = state.guests.find(function(x){ return x.id === id; });
      if (!g) return;
      var v = inp.value;
      if (f === 'nascitaEstero' || f === 'rilascioEstero' || f === 'residenzaEstero') v = (v === 'true');
      g[f] = v;
      saveGuests();

      var structurale = ['ruolo','nascitaEstero','rilascioEstero','residenzaEstero'].indexOf(f) !== -1;
      if (structurale){
        render();
      } else {
        var card = inp.closest('.as-guest');
        if (card){
          var nameEl = card.querySelector('.as-name');
          if (nameEl) nameEl.textContent = (g.cognome||g.nome? (g.cognome+' '+g.nome).trim() : 'Nuovo ospite');
          var problems = validateGuest(g);
          var msgEl = card.querySelector('.as-err, .as-ok');
          if (msgEl){
            msgEl.className = problems.length ? 'as-err' : 'as-ok';
            msgEl.textContent = problems.length ? problems.join(' · ') : 'Dati completi';
          }
        }
      }
    };
  });
  root.querySelectorAll('[data-istat-details]').forEach(function(det){
    det.addEventListener('toggle', function(){
      smoobuDetailsAperti['istat-'+det.getAttribute('data-istat-details')] = det.open;
    });
  });
  root.querySelectorAll('[data-doc-input]').forEach(function(input){
    input.onchange = function(e){
      var id = input.getAttribute('data-doc-input');
      var g = state.guests.find(function(x){ return x.id === id; });
      var file = e.target.files[0];
      if (!g || !file) return;
      ocrDocument(file, g).then(function(){ archiveDocument(file, g); });
      e.target.value = '';
    };
  });
}

var smoobuDetailsAperti = {};

async function caricaArriviSmoobu(){
  var box = document.getElementById('as-smoobu-arrivi');
  if (!box) return;
  try {
    var oggi = new Date();
    var tra7 = new Date(); tra7.setDate(tra7.getDate() + 7);
    var from = oggi.toISOString().slice(0,10);
    var to = tra7.toISOString().slice(0,10);
    var controller = new AbortController();
    var timeoutId = setTimeout(function(){ controller.abort(); }, 15000);
    var resp = await fetch(backendUrl('/api/smoobu/reservations?from='+from+'&to='+to), { headers: backendHeaders(), signal: controller.signal });
    clearTimeout(timeoutId);
    var data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'errore Smoobu');
    var bookings = (data.bookings || []).filter(function(b){ return b.type !== 'blocked-booking' && b.type !== 'cancellation'; });
    if (!bookings.length){
      box.innerHTML = '<p class="as-sub">Nessun arrivo previsto nei prossimi 7 giorni su Smoobu.</p>';
      return;
    }
    var righe = bookings.map(function(b){
      var nomeCompleto = b['guest-name'] || '';
      var collegate = state.guests.filter(function(g){ return g.smoobuBookingId === String(b.id); });
      var invioCollegato = state.invii.find(function(iv){ return iv.ospiti && iv.ospiti.some(function(o){ return o.smoobuBookingId === String(b.id); }); });
      var appMatch = state.tables.appartamenti.find(function(a){ return a.smoobuId && b.apartment && String(a.smoobuId) === String(b.apartment.id); });
      return { b: b, nomeCompleto: nomeCompleto, collegate: collegate, invioCollegato: invioCollegato, appMatch: appMatch };
    });
    box.innerHTML = '<p class="as-title" style="font-size:15px;">Prossimi arrivi (Smoobu)</p>' +
      righe.map(function(r){
        var b = r.b;
        var stato;
        if (r.invioCollegato){
          var nomiInviati = r.invioCollegato.ospiti.filter(function(o){return o.smoobuBookingId===String(b.id);}).map(function(o){return (o.cognome+' '+o.nome).trim();}).join(', ');
          stato = '<p class="as-ok" style="margin:4px 0 0;">Già inviata alla Questura (' + nomiInviati + ')</p>';
        } else if (r.collegate.length){
          var capo = r.collegate.find(function(g){ return g.ruolo==='capofamiglia'||g.ruolo==='capogruppo'; });
          var aperto = smoobuDetailsAperti[b.id] ? ' open' : '';
          stato = '<details style="margin-top:6px;" data-smoobu-details="'+b.id+'"'+aperto+'><summary style="cursor:pointer;color:var(--brass);font-size:13px;font-weight:600;">▸ ' +
            r.collegate.length + ' scheda/e: ' + r.collegate.map(function(g){ return (g.cognome+' '+g.nome).trim() || '(dati da inserire)'; }).join(', ') +
            '</summary><div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);">' +
            r.collegate.map(buildGuestCardHtml).join('') +
            (capo
              ? '<button class="as-btn ghost" data-crea-smoobu="'+encodeURIComponent(JSON.stringify(b))+'" data-capo-id="'+capo.id+'">+ altro ospite in questa prenotazione</button>'
              : '<p class="as-sub">Per aggiungere altri ospiti a questa prenotazione, cambia prima il Ruolo in "Capofamiglia" o "Capogruppo".</p>') +
            '</div></details>';
        } else {
          stato = '<button class="as-btn secondary" style="margin-top:6px;" data-crea-smoobu="'+encodeURIComponent(JSON.stringify(b))+'">Crea scheda</button>';
        }
        return '<div class="as-booking">' +
          '<div>'+toItDate(b.arrival)+' → '+toItDate(b.departure)+' · prenotazione a nome '+(r.nomeCompleto||'sconosciuto')+'</div>' +
          '<div class="as-sub" style="margin:0;">'+(b.apartment?b.apartment.name:'')+(r.appMatch?'':' <span style="color:var(--danger)">(appartamento non abbinato)</span>')+'</div>' +
          stato +
          '</div>';
      }).join('');
    box.querySelectorAll('[data-crea-smoobu]').forEach(function(btn){
      btn.onclick = function(){
        var b = JSON.parse(decodeURIComponent(btn.getAttribute('data-crea-smoobu')));
        var capoId = btn.getAttribute('data-capo-id');
        var g = newGuest();
        g.dataArrivo = b.arrival;
        g.smoobuBookingId = String(b.id);
        var arr = new Date(b.arrival), dep = new Date(b.departure);
        g.permanenza = String(Math.max(1, Math.round((dep-arr)/86400000)));
        var appMatch = state.tables.appartamenti.find(function(a){ return a.smoobuId && b.apartment && String(a.smoobuId) === String(b.apartment.id); });
        if (appMatch) g.idAppartamento = appMatch.id;
        if (capoId){ g.ruolo = 'familiare'; g.groupOf = capoId; }
        state.guests.push(g);
        smoobuDetailsAperti[b.id] = true;
        saveGuests(); render();
      };
    });
    box.querySelectorAll('[data-smoobu-details]').forEach(function(det){
      det.addEventListener('toggle', function(){
        smoobuDetailsAperti[det.getAttribute('data-smoobu-details')] = det.open;
      });
    });
    attachGuestHandlers(box);
  } catch(e){
    var orfani = state.guests.filter(function(g){ return g.smoobuBookingId; });
    var msg = '<div class="as-err">Arrivi Smoobu non disponibili: '+(e.name==='AbortError'?'il server non ha risposto in tempo (15s)':e.message)+'</div>';
    if (orfani.length){
      msg += '<p class="as-warn" style="margin-top:8px;">'+orfani.length+' ospiti erano collegati a una prenotazione Smoobu: li vedi qui sotto finché la connessione non torna, per non perderli.</p>';
      msg += orfani.map(buildGuestCardHtml).join('');
    }
    box.innerHTML = msg;
    attachGuestHandlers(box);
  }
}

function validateGuest(g){
  var probs = [];
  if (!g.cognome) probs.push('cognome mancante');
  if (!g.nome) probs.push('nome mancante');
  if (!g.dataNascita) probs.push('data di nascita mancante');
  if (g.nascitaEstero){
    if (!findByName(state.tables.stati, g.statoNascitaNome)) probs.push('stato di nascita non in tabella');
  } else {
    if (!findByName(state.tables.comuni, g.comuneNascitaNome)) probs.push('comune di nascita non in tabella');
  }
  if (!findByName(state.tables.stati, g.cittadinanzaNome)) probs.push('cittadinanza non in tabella');
  var isDependent = g.ruolo === 'familiare' || g.ruolo === 'membro';
  if (isDependent && !g.groupOf) probs.push('non collegato a un capofamiglia/capogruppo');
  if (!isDependent){
    if (!findByName(state.tables.documenti, g.tipoDocumentoNome)) probs.push('tipo documento non in tabella');
    if (!g.numeroDocumento) probs.push('numero documento mancante');
    if (g.rilascioEstero){
      if (!findByName(state.tables.stati, g.luogoRilascioNome)) probs.push('luogo rilascio (stato) non in tabella');
    } else {
      if (!findByName(state.tables.comuni, g.luogoRilascioNome)) probs.push('luogo rilascio (comune) non in tabella');
    }
    if (!g.dataArrivo) probs.push('data arrivo mancante');
    if (!g.permanenza) probs.push('permanenza mancante');
  }
  return probs;
}

function renderTabelle(){
  var el = document.getElementById('tab-tabelle');
  var html = '';
  html += '<div class="as-card">';
  html += '<p class="as-sub" style="margin-bottom:14px;">Incolla qui le tabelle ufficiali scaricate una volta dal portale Alloggiati Web (menu Area Download → Tabelle, formato Excel: converti i fogli Comuni / Stati / Tipi Documento in testo con formato <code>codice;nome</code>, per i comuni <code>codice;nome;provincia</code>). Restano salvate in questo dispositivo.</p>';

  ['comuni','stati','documenti','appartamenti'].forEach(function(kind){
    var label = kind==='comuni' ? 'Comuni (codice;nome;provincia)' : kind==='stati' ? 'Stati (codice;nome) — includi ITALIA' : kind==='documenti' ? 'Tipi documento (codice;nome)' : 'Appartamenti (id;nome;idSmoobu opzionale)';
    html += '<div class="as-field"><label>'+label+' — '+state.tables[kind].length+' voci caricate</label>' +
            '<textarea rows="4" id="ta-'+kind+'" placeholder="'+(kind==='comuni'?'058091;TORINO;TO':kind==='appartamenti'?'0;CARLO ALBERTO':'100000100;ITALIA')+'"></textarea>' +
            '<button class="as-btn secondary" style="margin-top:6px;" data-load="'+kind+'">Carica/aggiorna tabella</button></div>';
  });
  html += '</div>';
  el.innerHTML = html;

  el.querySelectorAll('[data-load]').forEach(function(btn){
    btn.onclick = function(){
      var kind = btn.getAttribute('data-load');
      var text = document.getElementById('ta-'+kind).value;
      if (!text.trim()) return;
      if (kind === 'appartamenti'){
        var lines2 = text.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
        var parsedApp = lines2.map(function(l){
          var sep = l.indexOf(';') !== -1 ? ';' : ',';
          var parts = l.split(sep).map(function(p){return p.trim();});
          return { id: parts[0], nome: parts[1], smoobuId: parts[2] || '' };
        }).filter(function(x){ return x.id && x.nome; });
        state.tables.appartamenti = parsedApp;
      } else {
        var parsed = parseCsv(text, kind);
        state.tables[kind] = parsed;
      }
      saveTables();
      render();
    };
  });

  if (state.backend.url){
    var importBox = document.createElement('div');
    importBox.className = 'as-card';
    importBox.innerHTML =
      '<p class="as-sub">In alternativa, scarica le tabelle direttamente dalla Questura tramite il backend configurato. Il formato esatto della tabella "Luoghi" (comuni + stati insieme) va verificato una volta: dopo lo scaricamento controlla l\'anteprima e conferma come interpretarla.</p>' +
      '<div class="as-row">' +
        '<button class="as-btn secondary" id="as-fetch-luoghi">Scarica Luoghi (comuni/stati)</button>' +
        '<button class="as-btn secondary" id="as-fetch-doc">Scarica tipi documento</button>' +
      '</div>' +
      '<div id="as-fetch-preview" style="margin-top:12px;"></div>';
    el.appendChild(importBox);

    document.getElementById('as-fetch-doc').onclick = function(){ fetchTabella('documenti'); };
    document.getElementById('as-fetch-luoghi').onclick = function(){ fetchTabella('luoghi'); };

    var smoobuBox = document.createElement('div');
    smoobuBox.className = 'as-card';
    smoobuBox.innerHTML =
      '<p class="as-sub">Scarica l\'elenco dei tuoi appartamenti su Smoobu, per abbinare l\'ID Smoobu a ciascun appartamento nella tabella qui sopra (terzo campo, opzionale).</p>' +
      '<button class="as-btn secondary" id="as-fetch-smoobu-app">Scarica appartamenti da Smoobu</button>' +
      '<div id="as-smoobu-app-result" style="margin-top:10px;"></div>';
    el.appendChild(smoobuBox);
    document.getElementById('as-fetch-smoobu-app').onclick = async function(){
      var out = document.getElementById('as-smoobu-app-result');
      out.innerHTML = '<span class="as-warn"><span class="as-spin"></span>scaricamento…</span>';
      try {
        var resp = await fetch(backendUrl('/api/smoobu/apartments'), { headers: backendHeaders() });
        var data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'errore');
        var list = data.apartments || data || [];
        out.innerHTML = '<div id="as-file-preview" style="max-height:160px;">' +
          list.map(function(a){ return a.id + ' — ' + (a.name||a.nome||''); }).join('\n') +
          '</div>';
      } catch(e){
        out.innerHTML = '<div class="as-err">'+e.message+'</div>';
      }
    };
  }
}

async function fetchTabella(kind){
  var endpoint = kind === 'luoghi' ? 'luoghi' : 'documenti';
  var out = document.getElementById('as-fetch-preview');
  out.innerHTML = '<span class="as-warn"><span class="as-spin"></span>scaricamento in corso…</span>';
  try {
    var resp = await fetch(backendUrl('/api/tabella/'+endpoint), { headers: backendHeaders() });
    var data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'errore backend');
    var lines = data.csv.split(/\r?\n/).filter(Boolean);
    var preview = lines.slice(0, 12).join('\n');
    out.innerHTML =
      '<p class="as-sub">'+lines.length+' righe ricevute. Anteprima:</p>' +
      '<div id="as-file-preview" style="max-height:160px;">'+preview.replace(/</g,'&lt;')+'</div>' +
      '<div class="as-row" style="margin-top:10px;">' +
        '<div class="as-field"><label>Colonna codice (0=prima)</label><input type="number" id="col-codice" value="0"></div>' +
        '<div class="as-field"><label>Colonna nome</label><input type="number" id="col-nome" value="1"></div>' +
        (kind==='luoghi' ? '<div class="as-field"><label>Colonna provincia (-1 se assente/stato)</label><input type="number" id="col-prov" value="2"></div>' : '') +
      '</div>' +
      '<div class="as-row">' +
        (kind==='luoghi' ?
          '<button class="as-btn" id="import-comuni">Importa come Comuni</button><button class="as-btn secondary" id="import-stati">Importa come Stati</button>'
          : '<button class="as-btn" id="import-doc">Importa come tipi documento</button>') +
      '</div>';

function mergeTable(existing, incoming){
  var out = existing.slice();
  incoming.forEach(function(item){
    var i = out.findIndex(function(x){ return x.codice === item.codice; });
    if (i >= 0) out[i] = item; else out.push(item);
  });
  return out;
}

function doImport(target){
      var ic = parseInt(document.getElementById('col-codice').value, 10);
      var inm = parseInt(document.getElementById('col-nome').value, 10);
      var ip = kind==='luoghi' ? parseInt(document.getElementById('col-prov').value, 10) : -1;
      var rows = lines.map(function(l){
        var sep = l.indexOf(';') !== -1 ? ';' : ',';
        return l.split(sep).map(function(p){return p.trim();});
      }).filter(function(r){ return r[ic] && r[inm]; });
      if (target === 'comuni'){
        state.tables.comuni = mergeTable(state.tables.comuni, rows.map(function(r){ return { codice:r[ic], nome:r[inm], provincia: ip>=0? (r[ip]||'') : '' }; }));
      } else {
        state.tables[target] = mergeTable(state.tables[target], rows.map(function(r){ return { codice:r[ic], nome:r[inm] }; }));
      }
      saveTables(); render();
    }
    if (kind==='luoghi'){
      document.getElementById('import-comuni').onclick = function(){ doImport('comuni'); };
      document.getElementById('import-stati').onclick = function(){ doImport('stati'); };
      var autoBtn = document.createElement('button');
      autoBtn.className = 'as-btn';
      autoBtn.style.marginTop = '8px';
      autoBtn.textContent = 'Importa automatico: separa comuni (con provincia) da stati (senza)';
      autoBtn.onclick = function(){
        var ic = parseInt(document.getElementById('col-codice').value, 10);
        var inm = parseInt(document.getElementById('col-nome').value, 10);
        var ip = parseInt(document.getElementById('col-prov').value, 10);
        var comuni = [], stati = [];
        lines.forEach(function(l){
          var sep = l.indexOf(';') !== -1 ? ';' : ',';
          var r = l.split(sep).map(function(p){return p.trim();});
          if (!r[ic] || !r[inm]) return;
          var prov = ip>=0 ? (r[ip]||'') : '';
          if (prov && prov.length <= 3){
            comuni.push({ codice:r[ic], nome:r[inm], provincia: prov });
          } else {
            stati.push({ codice:r[ic], nome:r[inm] });
          }
        });
        state.tables.comuni = mergeTable(state.tables.comuni, comuni);
        state.tables.stati = mergeTable(state.tables.stati, stati);
        saveTables(); render();
        alert('Importati ' + comuni.length + ' comuni e ' + stati.length + ' stati.');
      };
      document.getElementById('as-fetch-preview').appendChild(autoBtn);
    } else {
      document.getElementById('import-doc').onclick = function(){ doImport('documenti'); };
    }
  } catch(e){
    out.innerHTML = '<div class="as-err">'+e.message+'</div>';
  }
}

/* ---------- Genera file tab ---------- */
function pad(str, len){ str = (str||'').toString(); return str.length >= len ? str.slice(0,len) : str + ' '.repeat(len-str.length); }
function padNum(str, len){ str = (str||'').toString(); return str.length >= len ? str.slice(0,len) : '0'.repeat(len-str.length) + str; }
function toItDate(iso){
  if (!iso) return '';
  var p = iso.split('-');
  if (p.length !== 3) return '';
  return p[2] + '/' + p[1] + '/' + p[0];
}
var ruoloCode = { singolo:'16', capofamiglia:'17', capogruppo:'18', familiare:'19', membro:'20' };

function buildLine(g){
  var isDependent = g.ruolo === 'familiare' || g.ruolo === 'membro';
  var head = isDependent ? state.guests.find(function(x){return x.id===g.groupOf;}) : g;
  var comune = g.nascitaEstero ? null : findByName(state.tables.comuni, g.comuneNascitaNome);
  var statoNascita = g.nascitaEstero ? findByName(state.tables.stati, g.statoNascitaNome) : italiaEntry();
  var cittadinanza = findByName(state.tables.stati, g.cittadinanzaNome);

  var line = '';
  line += pad(ruoloCode[g.ruolo] || '', 2);
  line += pad(toItDate(head ? head.dataArrivo : g.dataArrivo), 10);
  line += padNum(head ? head.permanenza : g.permanenza, 2);
  line += pad(g.cognome, 50);
  line += pad(g.nome, 30);
  line += g.sesso === 'F' ? '2' : '1';
  line += pad(toItDate(g.dataNascita), 10);
  line += pad(comune ? comune.codice : '', 9);
  line += pad(comune ? comune.provincia : '', 2);
  line += pad(statoNascita ? statoNascita.codice : '', 9);
  line += pad(cittadinanza ? cittadinanza.codice : '', 9);

  if (!isDependent){
    var doc = findByName(state.tables.documenti, g.tipoDocumentoNome);
    var rilascio = g.rilascioEstero ? findByName(state.tables.stati, g.luogoRilascioNome) : findByName(state.tables.comuni, g.luogoRilascioNome);
    line += pad(doc ? doc.codice : '', 5);
    line += pad(g.numeroDocumento, 20);
    line += pad(rilascio ? rilascio.codice : '', 9);
  } else {
    line += ' '.repeat(5 + 20 + 9);
  }
  return line;
}

function orderedGuests(){
  var out = [];
  state.guests.forEach(function(g){
    if (g.ruolo === 'singolo' || g.ruolo === 'capofamiglia' || g.ruolo === 'capogruppo'){
      out.push(g);
      state.guests.forEach(function(d){
        if ((d.ruolo === 'familiare' || d.ruolo === 'membro') && d.groupOf === g.id) out.push(d);
      });
    }
  });
  return out;
}

function buildIstatArrivo(g, allOrdered){
  var comune = g.nascitaEstero ? null : findByName(state.tables.comuni, g.comuneNascitaNome);
  var statoNascita = g.nascitaEstero ? findByName(state.tables.stati, g.statoNascitaNome) : italiaEntry();
  var cittadinanza = findByName(state.tables.stati, g.cittadinanzaNome);
  var comuneRes = g.residenzaEstero ? null : findByName(state.tables.comuni, g.comuneResidenzaNome);
  var statoRes = g.residenzaEstero ? findByName(state.tables.stati, g.statoResidenzaNome) : italiaEntry();
  var head = (g.ruolo==='familiare'||g.ruolo==='membro') ? allOrdered.find(function(x){ return x.id===g.groupOf; }) : null;
  return {
    idswh: g.id,
    tipoalloggiato: ruoloCode[g.ruolo] || '16',
    idcapo: head ? head.id : '',
    cognome: g.cognome, nome: g.nome, sesso: g.sesso === 'F' ? 'F' : 'M',
    cittadinanza: cittadinanza ? cittadinanza.codice : '',
    statoresidenza: statoRes ? statoRes.codice : '',
    luogoresidenza: g.residenzaEstero ? (g.comuneResidenzaNome||'') : (comuneRes ? comuneRes.codice : ''),
    datanascita: (g.dataNascita||'').replace(/-/g,''),
    statonascita: statoNascita ? statoNascita.codice : '',
    comunenascita: comune ? comune.codice : '',
    tipoturismo: g.tipoTurismo || 'Non specificato',
    mezzotrasporto: g.mezzoTrasporto || 'Non specificato'
  };
}

async function inviaIstatArrivi(arriviOggi, allOrdered){
  if (!arriviOggi.length) throw new Error('nessun ospite con arrivo odierno');
  var arrivi = arriviOggi.map(function(g){ return buildIstatArrivo(g, allOrdered); });
  var resp = await fetch(backendUrl('/api/istat/movimento'), {
    method: 'POST',
    headers: backendHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({
      data: todayISO().replace(/-/g,''),
      camereOccupate: new Set(arriviOggi.map(function(g){ return g.idAppartamento; })).size,
      arrivi: arrivi
    })
  });
  var data = await resp.json();
  if (!resp.ok) throw new Error(data.error || 'errore invio ISTAT');
  await segnaIstatInviato(todayISO());
  return data;
}

async function inviaIstat(ordered){
  var out = document.getElementById('as-istat-result');
  var oggiISO = todayISO();
  var arriviOggi = ordered.filter(function(g){ return g.dataArrivo === oggiISO; });
  if (!arriviOggi.length){
    out.innerHTML = '<div class="as-err">Nessun ospite con data di arrivo odierna tra quelli generati.</div>';
    return;
  }
  out.innerHTML = '<span class="as-warn"><span class="as-spin"></span>invio in corso…</span>';
  try {
    await inviaIstatArrivi(arriviOggi, ordered);
    out.innerHTML = '<p class="as-ok">Inviato correttamente a Piemonte Dati Turismo (' + arriviOggi.length + ' ospiti).</p>';
  } catch(e){
    out.innerHTML = '<div class="as-err">'+e.message+'</div>';
  }
}

async function sendToBackend(lines, real, idAppartamento, ordered){
  var out = document.getElementById('as-send-result');
  out.innerHTML = '<span class="as-warn"><span class="as-spin"></span>'+(real?'invio':'validazione')+' in corso…</span>';
  try {
    var resp = await fetch(backendUrl(real ? '/api/schedine/send' : '/api/schedine/test'), {
      method: 'POST',
      headers: backendHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ righe: lines, idAppartamento: idAppartamento || undefined })
    });
    var data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'errore backend');
    var html = '<p class="as-ok">Schedine valide: ' + data.schedineValide + ' / ' + lines.length + '</p>';
    var errori = (data.righeErrori || []).filter(Boolean);
    if (errori.length){
      html += '<div class="as-err">Errori per riga:<br>' + errori.map(function(e,i){return (i+1)+': '+e;}).join('<br>') + '</div>';
    } else if (real) {
      html += '<p class="as-ok">Inviato correttamente alla Questura.</p>';
      if (state.backend.url){
        try {
          await inviaIstatArrivi(ordered.filter(function(g){ return g.dataArrivo === todayISO(); }), ordered);
          html += '<p class="as-ok">Inviato correttamente anche a Piemonte Dati Turismo (ISTAT).</p>';
        } catch(e){
          html += '<div class="as-err">Questura OK, ma invio ISTAT fallito: '+e.message+'. Puoi ripeterlo da "Genera file".</div>';
        }
      }
      await archiveInvio(ordered, idAppartamento, lines.length);
      html += '<p class="as-sub">Ospiti spostati nell\'archivio invii.</p>';
      html += '<button class="as-btn secondary" id="as-ricevuta-btn" style="margin-top:8px;">Scarica ricevuta di oggi</button>';
    }
    out.innerHTML = html;
    var ricBtn = document.getElementById('as-ricevuta-btn');
    if (ricBtn) ricBtn.onclick = function(){ scaricaRicevuta(todayISO(), ricBtn); };
    if (real && !errori.length){ render(); }
  } catch(e){
    out.innerHTML = '<div class="as-err">'+e.message+'</div>';
  }
}

async function archiveInvio(ordered, idAppartamento, nRighe){
  var appNome = (state.tables.appartamenti.find(function(a){ return a.id===idAppartamento; })||{}).nome || idAppartamento || '';
  var entry = {
    id: uid(),
    dataInvio: new Date().toISOString(),
    idAppartamento: idAppartamento || '',
    appartamentoNome: appNome,
    nRighe: nRighe,
    ospiti: ordered.map(function(g){ return { id: g.id, cognome: g.cognome, nome: g.nome, ruolo: g.ruolo, dataArrivo: g.dataArrivo, permanenza: g.permanenza, smoobuBookingId: g.smoobuBookingId || '' }; }),
    partenzaSegnalata: false
  };
  state.invii.push(entry);
  var sentIds = ordered.map(function(g){ return g.id; });
  state.guests = state.guests.filter(function(g){ return sentIds.indexOf(g.id) === -1; });
  try { await remoteStorage.set('as-invii', JSON.stringify(state.invii)); } catch(e){}
  await saveGuests();
}

async function inviaGiorniMancantiIstat(giorni, btn){
  var out = document.getElementById('as-gap-result');
  btn.disabled = true;
  var okCount = 0;
  for (var i=0;i<giorni.length;i++){
    var dISO = giorni[i];
    out.innerHTML = '<span class="as-warn"><span class="as-spin"></span>invio '+(i+1)+'/'+giorni.length+' ('+toItDate(dISO)+')…</span>';

      var resp = await fetch(backendUrl('/api/istat/movimento'), {
        method: 'POST',
        headers: backendHeaders({ 'Content-Type': 'application/json' }),

      });

async function segnalaPartenza(invioId, btn){
  var iv = state.invii.find(function(x){ return x.id === invioId; });
  if (!iv) return;
  var suggerita = '';
  if (iv.ospiti[0] && iv.ospiti[0].dataArrivo && iv.ospiti[0].permanenza){
    var d = new Date(iv.ospiti[0].dataArrivo);
    d.setDate(d.getDate() + parseInt(iv.ospiti[0].permanenza, 10));
    suggerita = d.toISOString().slice(0,10);
  }
  var dataPartenza = prompt('Data di partenza effettiva (AAAA-MM-GG):', suggerita || todayISO());
  if (!dataPartenza) return;
  var out = document.getElementById('as-partenza-result-'+invioId);
  out.innerHTML = '<span class="as-warn"><span class="as-spin"></span>invio in corso…</span>';
  try {
    var partenze = iv.ospiti.map(function(o){
      return { idswh: o.id, tipoalloggiato: ruoloCode[o.ruolo] || '16', arrivo: (o.dataArrivo||'').replace(/-/g,'') };
    });
    var resp = await fetch(backendUrl('/api/istat/movimento'), {
      method: 'POST',
      headers: backendHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({
        data: dataPartenza.replace(/-/g,''),
        camereOccupate: 0,
        partenze: partenze
      })
    });
    var data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'errore invio ISTAT');
    iv.partenzaSegnalata = true;
    await remoteStorage.set('as-invii', JSON.stringify(state.invii));
    await segnaIstatInviato(dataPartenza);
    out.innerHTML = '<p class="as-ok">Partenza segnalata correttamente.</p>';
    render();
  } catch(e){
    out.innerHTML = '<div class="as-err">'+e.message+'</div>';
  }
}

async function scaricaRicevuta(dataISO, btn){
  var orig = btn.textContent;
  btn.textContent = 'Scaricamento…'; btn.disabled = true;
  try {
    var resp = await fetch(backendUrl('/api/ricevuta?data='+dataISO), { headers: backendHeaders() });
    var data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'ricevuta non disponibile');
    var byteChars = atob(data.pdfBase64);
    var bytes = new Uint8Array(byteChars.length);
    for (var i=0;i<byteChars.length;i++) bytes[i] = byteChars.charCodeAt(i);
    var blob = new Blob([bytes], { type: 'application/pdf' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'ricevuta_' + dataISO + '.pdf'; a.click();
    URL.revokeObjectURL(url);
    btn.textContent = orig; btn.disabled = false;
  } catch(e){
    alert('Ricevuta non disponibile: ' + e.message);
    btn.textContent = orig; btn.disabled = false;
  }
}

    html += '<div class="as-card">';
    html += '<p class="as-title" style="font-size:16px;">Invii alla Questura</p>';
    var invOrdinati = state.invii.slice().sort(function(a,b){ return b.dataInvio.localeCompare(a.dataInvio); });
    var dateUniche = [];
    invOrdinati.forEach(function(iv){
      var g = new Date(iv.dataInvio);
      var dataLocale = g.toLocaleDateString('it-IT') + ' ' + g.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
      var dataISO = iv.dataInvio.slice(0,10);
      var nomi = iv.ospiti.map(function(o){ return (o.cognome+' '+o.nome).trim(); }).join(', ');
      html += '<div style="border-bottom:1px solid var(--border);padding:8px 0;">' +
        '<div>' + dataLocale + ' — ' + (iv.appartamentoNome||'nessun appartamento') + ' (' + iv.nRighe + ' schedine)</div>' +
        '<div class="as-sub" style="margin:0;">' + nomi + '</div>' +
        (dateUniche.indexOf(dataISO)===-1 ? '<button class="as-btn ghost" data-ricevuta="'+dataISO+'" style="margin-top:6px;">Scarica ricevuta del '+g.toLocaleDateString('it-IT')+'</button>' : '') +
        (iv.partenzaSegnalata
          ? '<span class="as-ok" style="margin-left:8px;">Partenza segnalata (ISTAT)</span>'
          : '<button class="as-btn secondary" data-partenza="'+iv.id+'" style="margin-top:6px;margin-left:8px;">Segnala partenza (ISTAT)</button>') +
        '<div id="as-partenza-result-'+iv.id+'" style="margin-top:6px;"></div>' +
        '</div>';
      if (dateUniche.indexOf(dataISO)===-1) dateUniche.push(dataISO);
    });
    html += '</div>';
  }

  if (!state.archivio.length){
    html += '<div class="as-card"><p class="as-sub">Nessun documento archiviato. Le foto caricate nella scheda "Ospiti" vengono salvate qui automaticamente, con cognome/nome del capogruppo e periodo di soggiorno.</p></div>';
    el.innerHTML = html;
    el.querySelectorAll('[data-ricevuta]').forEach(function(btn){
      btn.onclick = function(){ scaricaRicevuta(btn.getAttribute('data-ricevuta'), btn); };
    });
    el.querySelectorAll('[data-partenza]').forEach(function(btn){
      btn.onclick = function(){ segnalaPartenza(btn.getAttribute('data-partenza'), btn); };
    });
    var gapBtn1 = document.getElementById('as-gap-btn');
    if (gapBtn1) gapBtn1.onclick = function(){ inviaGiorniMancantiIstat(giorniIstatMancanti(), gapBtn1); };
    return;
  }
  var groups = {};
  var order = [];
  state.archivio.slice().sort(function(a,b){ return (b.dataArrivo||'').localeCompare(a.dataArrivo||''); }).forEach(function(e){
    var k = groupKey(e);
    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push(e);
  });

  html += '<div class="as-card">';
  order.forEach(function(k){
    var items = groups[k];
    var head = items[0];
    var periodo = toItDate(head.dataArrivo) + (head.permanenza ? ' · ' + head.permanenza + ' notti' : '');
    html += '<div class="as-group-head">' + (head.cognomeCapogruppo+' '+head.nomeCapogruppo).trim() + '</div>';
    html += '<div class="as-group-period">' + periodo + '</div>';
    html += '<div class="as-doc-grid">';
    items.forEach(function(e){
      html += '<div class="as-doc" data-entry="'+e.id+'">' +
              (e.isPdf
                ? '<div data-pdf-doc="'+e.fotoKey+'" style="width:100%;height:64px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;background:var(--surface-2);border-radius:4px;">📄</div>'
                : '<img data-photo="'+e.fotoKey+'" alt="documento">') +
              '<div class="n">'+(e.cognomeOspite+' '+e.nomeOspite).trim()+'</div>' +
              '<button class="as-remove" data-remove-doc="'+e.id+'" style="margin-top:4px;">rimuovi</button>' +
              '</div>';
    });
    html += '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
  el.querySelectorAll('[data-ricevuta]').forEach(function(btn){
    btn.onclick = function(){ scaricaRicevuta(btn.getAttribute('data-ricevuta'), btn); };
  });
  el.querySelectorAll('[data-partenza]').forEach(function(btn){
    btn.onclick = function(){ segnalaPartenza(btn.getAttribute('data-partenza'), btn); };
  });
  var gapBtn2 = document.getElementById('as-gap-btn');
  if (gapBtn2) gapBtn2.onclick = function(){ inviaGiorniMancantiIstat(giorniIstatMancanti(), gapBtn2); };

  el.querySelectorAll('img[data-photo]').forEach(function(img){
    var key = img.getAttribute('data-photo');
    remoteStorage.get(key).then(function(res){
      if (res && res.value) img.src = 'data:image/jpeg;base64,' + res.value;
    }).catch(function(){});
    img.onclick = function(){
      remoteStorage.get(key).then(function(res){
        if (res && res.value){
          var w = window.open();
          w.document.write('<img src="data:image/jpeg;base64,'+res.value+'" style="max-width:100%">');
        }
      }).catch(function(){});
    };
  });
  el.querySelectorAll('[data-pdf-doc]').forEach(function(box){
    var key = box.getAttribute('data-pdf-doc');
    box.onclick = function(){
      remoteStorage.get(key).then(function(res){
        if (res && res.value){
          var byteChars = atob(res.value);
          var bytes = new Uint8Array(byteChars.length);
          for (var i=0;i<byteChars.length;i++) bytes[i] = byteChars.charCodeAt(i);
          var blob = new Blob([bytes], { type: 'application/pdf' });
          var url = URL.createObjectURL(blob);
          window.open(url, '_blank');
        }
      }).catch(function(){});
    };
  });
  el.querySelectorAll('[data-remove-doc]').forEach(function(btn){
    btn.onclick = async function(){
      var id = btn.getAttribute('data-remove-doc');
      var entry = state.archivio.find(function(x){ return x.id === id; });
      if (!entry) return;
      try {
        await remoteStorage.delete(entry.fotoKey);
      } catch(e){}
      state.archivio = state.archivio.filter(function(x){ return x.id !== id; });
      saveArchivio(); render();
    };
  });
}

/* ---------- Backend tab ---------- */
function renderBackend(){
  var el = document.getElementById('tab-backend');
  el.innerHTML =
    '<div class="as-card">' +
    '<p class="as-sub">Indirizzo del backend installato sul tuo QNAP (es. http://192.168.1.50:4600) e la chiave segreta scelta nel file .env del server. Utente, password e WSKEY della Questura restano SOLO sul server, mai in questa app.</p>' +
    '<div class="as-field"><label>Indirizzo backend</label><input id="be-url" value="'+(state.backend.url||'')+'" placeholder="http://192.168.1.50:4600"></div>' +
    '<div class="as-field"><label>Chiave segreta (APP_SECRET)</label><input id="be-secret" type="password" value="'+(state.backend.secret||'')+'"></div>' +
    '<button class="as-btn secondary" id="be-save">Salva</button>' +
    '<button class="as-btn ghost" id="be-test" style="margin-left:8px;">Verifica connessione</button>' +
    '<div id="be-result" style="margin-top:10px;"></div>' +
    '</div>';

  document.getElementById('be-save').onclick = function(){
    state.backend.url = document.getElementById('be-url').value.trim();
    state.backend.secret = document.getElementById('be-secret').value.trim();
    saveBackend(); render();
  };
  document.getElementById('be-test').onclick = async function(){
    var out = document.getElementById('be-result');
    out.innerHTML = '<span class="as-warn"><span class="as-spin"></span>verifica in corso…</span>';
    try {
      var resp = await fetch(backendUrl('/api/status'), { headers: backendHeaders() });
      var data = await resp.json();
      if (!resp.ok || !data.ok) throw new Error(data.error || 'connessione fallita');
      out.innerHTML = '<p class="as-ok">Connesso. Token valido fino alle ' + new Date(data.scade).toLocaleTimeString('it-IT') + '.</p>';
    } catch(e){
      out.innerHTML = '<div class="as-err">'+e.message+'</div>';
    }
  };

  if (state.backend.url){
    var settingsBox = document.createElement('div');
    settingsBox.className = 'as-card';
    settingsBox.innerHTML =
      '<p class="as-title" style="font-size:16px;">Altre integrazioni</p>' +
      '<p class="as-sub">Smoobu e Piemonte Dati Turismo (ISTAT). Salvate direttamente sul server, senza dover toccare Docker.</p>' +
      '<p class="as-sub" style="margin-top:14px;"><strong>Smoobu</strong></p>' +
      '<div class="as-field"><label>API Key</label><input id="cfg-SMOOBU_API_KEY"></div>' +
      '<div class="as-field"><label>API Secret</label><input id="cfg-SMOOBU_API_SECRET" type="password"></div>' +
      '<p class="as-sub" style="margin-top:14px;"><strong>Piemonte Dati Turismo (ISTAT)</strong></p>' +
      '<div class="as-field"><label>Utente</label><input id="cfg-ISTAT_UTENTE"></div>' +
      '<div class="as-field"><label>Password</label><input id="cfg-ISTAT_PASSWORD" type="password"></div>' +
      '<div class="as-field"><label>Codice struttura</label><input id="cfg-ISTAT_CODICE_STRUTTURA"></div>' +
      '<div class="as-row">' +
        '<div class="as-field"><label>Camere disponibili</label><input id="cfg-ISTAT_CAMERE_DISPONIBILI"></div>' +
        '<div class="as-field"><label>Letti disponibili</label><input id="cfg-ISTAT_LETTI_DISPONIBILI"></div>' +
      '</div>' +
      '<button class="as-btn secondary" id="cfg-save">Salva impostazioni</button>' +
      '<div id="cfg-result" style="margin-top:10px;"></div>';
    document.getElementById('tab-backend').appendChild(settingsBox);

    var cfgKeys = ['SMOOBU_API_KEY','SMOOBU_API_SECRET','ISTAT_UTENTE','ISTAT_PASSWORD','ISTAT_CODICE_STRUTTURA','ISTAT_CAMERE_DISPONIBILI','ISTAT_LETTI_DISPONIBILI'];
    fetch(backendUrl('/api/settings'), { headers: backendHeaders() }).then(function(r){ return r.json(); }).then(function(data){
      cfgKeys.forEach(function(k){ var el2 = document.getElementById('cfg-'+k); if (el2 && data[k]) el2.value = data[k]; });
    }).catch(function(){});

    document.getElementById('cfg-save').onclick = async function(){
      var out2 = document.getElementById('cfg-result');
      out2.innerHTML = '<span class="as-warn"><span class="as-spin"></span>salvataggio…</span>';
      var payload = {};
      cfgKeys.forEach(function(k){ payload[k] = document.getElementById('cfg-'+k).value.trim(); });
      try {
        var resp2 = await fetch(backendUrl('/api/settings'), {
          method: 'POST',
          headers: backendHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(payload)
        });
        var data2 = await resp2.json();
        if (!resp2.ok) throw new Error(data2.error || 'errore salvataggio');
        out2.innerHTML = '<p class="as-ok">Impostazioni salvate sul server.</p>';
      } catch(e){
        out2.innerHTML = '<div class="as-err">'+e.message+'</div>';
      }
    };
  }
}

/* ---------- Tabs & main render ---------- */
function render(){
  var scrollY = window.scrollY || document.documentElement.scrollTop || 0;
  renderOspiti(); renderTabelle(); renderGenera(); renderArchivio(); renderBackend(); renderLink();
  function restore(){ window.scrollTo(0, scrollY); }
  restore();
  requestAnimationFrame(restore);
  requestAnimationFrame(function(){ requestAnimationFrame(restore); });
  setTimeout(restore, 30);
  setTimeout(restore, 100);
  setTimeout(restore, 250);
  setTimeout(restore, 500);
}

var adminUnlocked = false;

function switchTab(name){
  document.querySelectorAll('.as-tab[data-tab]').forEach(function(t){ t.classList.remove('active'); });
  var btn = document.querySelector('.as-tab[data-tab="'+name+'"]');
  if (btn) btn.classList.add('active');
  if (name === 'tabelle') renderTabelle();
  else if (name === 'genera') renderGenera();
  else if (name === 'archivio') renderArchivio();
  else if (name === 'backend') renderBackend();
  else if (name === 'link') renderLink();
  ['ospiti','tabelle','genera','archivio','backend','link'].forEach(function(n){
    var el = document.getElementById('tab-'+n);
    if (el) el.classList.toggle('as-hidden', n !== name);
  });
}

document.querySelectorAll('.as-tab[data-tab]').forEach(function(tab){
  tab.onclick = function(){ switchTab(tab.getAttribute('data-tab')); };
});

document.getElementById('as-admin-tab').onclick = function(){
  if (adminUnlocked){ switchTab('backend'); return; }
  var code = prompt('Codice amministratore');
  if (code === null) return;
  if (code.trim() === '050808'){
    adminUnlocked = true;
    var adminBtn = document.getElementById('as-admin-tab');
    adminBtn.textContent = 'Admin';
    adminBtn.style.opacity = '1';
    var tabelleBtn = document.createElement('div');
    tabelleBtn.className = 'as-tab';
    tabelleBtn.setAttribute('data-tab','tabelle');
    tabelleBtn.textContent = 'Tabelle codici';
    tabelleBtn.onclick = function(){ switchTab('tabelle'); };
    var backendBtn = document.createElement('div');
    backendBtn.className = 'as-tab';
    backendBtn.setAttribute('data-tab','backend');
    backendBtn.textContent = 'Backend';
    backendBtn.onclick = function(){ switchTab('backend'); };
    var linkBtn = document.createElement('div');
    linkBtn.className = 'as-tab';
    linkBtn.setAttribute('data-tab','link');
    linkBtn.textContent = 'Portali';
    linkBtn.onclick = function(){ switchTab('link'); };
    adminBtn.parentNode.insertBefore(tabelleBtn, adminBtn);
    adminBtn.parentNode.insertBefore(backendBtn, adminBtn);
    adminBtn.parentNode.insertBefore(linkBtn, adminBtn);
    switchTab('backend');
  } else {
    alert('Codice errato');
  }
};

loadState().then(render);

})();

</script>
<script>
(function(){
  var switcher = document.getElementById('ts-switcher');
  var porteSection = document.getElementById('porte-section');
  var questuraSection = document.getElementById('questura-section');
  var btnPorte = document.getElementById('ts-btn-porte');
  var btnQuestura = document.getElementById('ts-btn-questura');

  function showPorte(){
    porteSection.style.display = 'block';
    questuraSection.style.display = 'none';
    btnPorte.classList.add('ts-active');
    btnQuestura.classList.remove('ts-active');
  }
  function showQuestura(){
    porteSection.style.display = 'none';
    questuraSection.style.display = 'block';
    btnQuestura.classList.add('ts-active');
    btnPorte.classList.remove('ts-active');
  }
  btnPorte.onclick = showPorte;
  btnQuestura.onclick = showQuestura;

  var root = document.getElementById('root');
  var giaSbloccato = false;
  function checkUnlocked(){
    if (!giaSbloccato && root.querySelector('.app-root') && !root.querySelector('.lock-screen')) {
      giaSbloccato = true;
      switcher.classList.add('ts-visible');
      showQuestura();
    }
  }
  checkUnlocked();
  new MutationObserver(checkUnlocked).observe(root, { childList: true, subtree: true });
})();
</script>
