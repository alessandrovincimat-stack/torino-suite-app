${Hp}

:root {
  --bg: #0a0a0a;
  --surface: #141210;
  --surface-2: #1c1915;
  --border: #2a2620;
  --brass: #c9a24a;
  --brass-dim: #8a713a;
  --steel: #a8956a;
  --text: #f2ede3;
  --text-muted: #9c9686;
  --danger: #b25a45;
  --ok: #8aae6f;
}

.app-root {
  min-height: 100vh;
  background: radial-gradient(1200px 600px at 50% -10%, #171410 0%, var(--bg) 60%);
  font-family: 'Inter', sans-serif;
  color: var(--text);
}

* { box-sizing: border-box; }

.screen { min-height: 100vh; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(20px + env(safe-area-inset-top)) 20px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(18,20,26,0.9);
  backdrop-filter: blur(6px);
  z-index: 5;
}
.topbar-home { align-items: center; }

.title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: 23px;
  letter-spacing: 0.5px;
}

.back {
  display: flex;
  align-items: center;
  gap: 2px;
  background: none;
  border: none;
  color: var(--steel);
  font-size: 18px;
  cursor: pointer;
  width: 76px;
}
.back:focus-visible { outline: 2px solid var(--steel); border-radius: 6px; }

.brand-eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--brass);
}
.brand-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: 34px;
  letter-spacing: 0.5px;
  margin-top: 2px;
}

.add-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.add-btn:hover { border-color: var(--brass-dim); }
.add-btn:focus-visible { outline: 2px solid var(--brass); }

.content {
  padding: 18px 20px 60px;
  max-width: 620px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

.grid {
  padding: 20px;
  max-width: 640px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 14px;
}

/* --- keytag: elemento firma, targhetta fisica --- */
.keytag {
  position: relative;
  display: flex;
  gap: 12px;
  background: linear-gradient(155deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border);
  border-left: 3px solid var(--brass);
  border-radius: 10px;
  padding: 16px 16px 16px 22px;
  text-align: left;
  cursor: pointer;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  transition: transform 0.12s ease, border-color 0.12s ease;
}
.keytag:hover { transform: translateY(-1px); border-color: var(--brass-dim); }
.keytag:focus-visible { outline: 2px solid var(--brass); }

.keytag-hole {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--border);
}

.keytag-body { flex: 1; min-width: 0; }

.keytag-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.led {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13.5px;
  letter-spacing: 0.5px;
}
.led-on { color: var(--ok); }
.led-off { color: var(--text-muted); }

.keytag-name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: 23px;
  letter-spacing: 0.3px;
}

.keytag-meta {
  margin-top: 6px;
  font-size: 15px;
  color: var(--text-muted);
  display: flex;
  gap: 6px;
}
.meta-warn { color: var(--danger); }
.dot { opacity: 0.5; }

/* --- righe menu funzioni --- */
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 18px 16px;
  border-radius: 10px;
  margin-bottom: 6px;
  cursor: pointer;
  font-size: 18px;
  font-family: 'Inter', sans-serif;
  text-align: left;
}
.row:hover { background: var(--surface-2); }
.row:focus-visible { outline: 2px solid var(--steel); }
.row-label { flex: 1; }
.row-chevron { color: var(--text-muted); font-size: 21px; }
.row-danger { color: var(--danger); }
.row-danger svg { color: var(--danger); }

.section-gap { height: 14px; }

.pill {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  padding: 3px 8px;
  border-radius: 20px;
  letter-spacing: 0.5px;
  margin-right: 4px;
}
.pill-on { background: rgba(111,174,140,0.15); color: var(--ok); }
.pill-off { background: rgba(139,144,156,0.15); color: var(--text-muted); }

.field-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14.5px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.tier-list { display: flex; flex-direction: column; gap: 6px; }
.tier {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
  padding: 12px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 17px;
}
.tier-active {
  border-color: var(--brass);
  color: var(--text);
  background: rgba(201,162,74,0.08);
}
.tier:focus-visible { outline: 2px solid var(--steel); }

.log { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--border); }
.log-row {
  display: flex;
  gap: 14px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 17px;
}
.log-time {
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text-muted);
  font-size: 15.5px;
  white-space: nowrap;
  padding-top: 1px;
}

.empty, .empty-inline { color: var(--text-muted); font-size: 17px; }

.textarea, .input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 12px 14px;
  font-family: 'Inter', sans-serif;
  font-size: 17px;
  resize: vertical;
}
.textarea:focus, .input:focus { outline: 2px solid var(--steel); border-color: transparent; }

select.input {
  appearance: none;
  -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 13px) calc(50% - 3px);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  cursor: pointer;
}

.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--brass);
  color: #1a1508;
  border: none;
  border-radius: 8px;
  padding: 14px 16px;
  font-weight: 600;
  font-size: 17px;
  cursor: pointer;
  margin-top: 10px;
  font-family: 'Inter', sans-serif;
}
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary:focus-visible { outline: 2px solid var(--text); }

.header-right { display: flex; align-items: center; }

.segmented {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
}
.segmented button {
  background: none;
  border: none;
  color: var(--text-muted);
  padding: 7px 14px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
}
.segmented button.active {
  background: var(--brass);
  color: #1a1508;
  font-weight: 600;
}

.bacheca-preview {
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  background: linear-gradient(155deg, var(--surface-2) 0%, var(--surface) 100%);
  border: 1px solid var(--border);
  border-left: 3px solid var(--brass);
  border-radius: 12px;
  font-size: 18px;
  color: var(--text);
}

.code-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  cursor: pointer;
  color: var(--steel);
}
.code-chip-group {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-right: 8px;
}
.code-chip:hover { border-color: var(--steel); }
.sms-link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 6px;
  background: rgba(91,122,153,0.15);
  color: var(--steel);
  text-decoration: none;
}
.sms-link:hover { background: rgba(91,122,153,0.28); }
.code-text {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 15px;
  letter-spacing: 0.5px;
  color: var(--text);
}

.prefix-list { display: flex; flex-direction: column; gap: 8px; }
.prefix-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.prefix-label { font-size: 17px; color: var(--text); flex: 1; }
.prefix-input {
  width: 90px;
  font-family: 'IBM Plex Mono', monospace;
  text-align: center;
  text-transform: uppercase;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface-2);
  border: 1px solid var(--brass-dim);
  color: var(--text);
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 16.5px;
  font-family: 'IBM Plex Mono', monospace;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 20;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  width: 100%;
  max-width: 360px;
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: 22px;
  margin-bottom: 16px;
}
.icon-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
}

/* --- schermata di blocco --- */
.lock-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  text-align: center;
}

.lock-logo {
  width: 190px;
  color: var(--brass);
  filter: drop-shadow(0 0 24px rgba(201,162,74,0.15));
}
.lock-sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  margin-top: 14px;
  text-transform: uppercase;
}

.lock-dots {
  display: flex;
  gap: 18px;
  margin-top: 40px;
}
.lock-dots-error { animation: shake 0.35s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.lock-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #050505;
  box-shadow: inset 0 0 3px rgba(0,0,0,0.8), 0 0 0 1px var(--border);
  transition: background 0.15s ease, box-shadow 0.15s ease;
}
.lock-dot-filled {
  background: var(--brass);
  box-shadow:
    0 0 0 1px var(--brass),
    0 0 8px 2px rgba(201,162,74,0.85),
    0 0 18px 4px rgba(201,162,74,0.35);
  animation: dot-light-up 0.25s ease;
}
@keyframes dot-light-up {
  0% { transform: scale(0.5); box-shadow: 0 0 0 1px var(--brass); }
  60% { transform: scale(1.25); }
  100% { transform: scale(1); }
}

.lock-error {
  margin-top: 12px;
  font-size: 15.5px;
  color: var(--danger);
  font-family: 'Inter', sans-serif;
}

.lock-keypad {
  margin-top: 40px;
  display: grid;
  grid-template-columns: repeat(3, 64px);
  gap: 18px;
}
.lock-key {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 38%, #1e1a12 0%, #0e0d0b 78%);
  border: 1px solid rgba(201,162,74,0.35);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.04),
    inset 0 -2px 6px rgba(0,0,0,0.6),
    0 0 6px rgba(201,162,74,0.12);
  color: var(--brass);
  font-family: 'Orbitron', 'Space Grotesk', sans-serif;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 1px;
  text-shadow: 0 0 6px rgba(201,162,74,0.55), 0 0 14px rgba(201,162,74,0.25);
  cursor: pointer;
  transition: box-shadow 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
}
.lock-key:hover {
  border-color: var(--brass);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.05),
    inset 0 -2px 6px rgba(0,0,0,0.6),
    0 0 14px rgba(201,162,74,0.3);
}
.lock-key:active {
  transform: scale(0.94);
  color: #fff6df;
  text-shadow: 0 0 10px rgba(201,162,74,0.9), 0 0 22px rgba(201,162,74,0.5);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.05),
    inset 0 -1px 4px rgba(0,0,0,0.5),
    0 0 22px rgba(201,162,74,0.55);
}
.lock-key:focus-visible { outline: 2px solid var(--brass); }
.lock-key-ghost {
  background: none;
  border: none;
  box-shadow: none;
  color: var(--text-muted);
  text-shadow: none;
  font-size: 21px;
}
.lock-key-ghost:active {
  transform: scale(0.94);
  color: var(--text);
  box-shadow: none;
  text-shadow: none;
}

/* --- overlay di rivelazione: il logo scorre e svela l'app --- */
.reveal-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: reveal-slide 0.9s cubic-bezier(0.65, 0, 0.35, 1) forwards;
  pointer-events: none;
}
.reveal-logo {
  width: 170px;
  color: var(--brass);
